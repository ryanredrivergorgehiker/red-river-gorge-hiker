name: Audit Menifee tourism ArcGIS sources

on:
  workflow_dispatch:
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - 'scripts/audit_menifee_tourism_map.py'
      - '.github/workflows/audit-menifee-tourism-map.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect public Menifee County tourism ArcGIS app
        run: python scripts/audit_menifee_tourism_map.py
