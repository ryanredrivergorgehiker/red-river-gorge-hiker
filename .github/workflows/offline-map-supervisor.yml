name: RRGH guarded map supervisor (read-only pilot)
on:
  push:
    branches: [lane20/unattended-supervisor-20261031]
    paths:
      - .github/workflows/offline-map-supervisor.yml
      - backend/scripts/rrgh_map_supervisor.py
      - backend/scripts/test_rrgh_map_supervisor.py
      - .github/automation/rrgh_prepare_next_wave.py
      - .github/automation/rrgh_publish_next_wave.py
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - RRGH bounded source-local map campaign and independent recovery
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: rrgh-supervisor-readonly
  cancel-in-progress: false
jobs:
  audit:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_branch == 'lane20/offline-production-preflight-20261029' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.run_attempt == 1) ||
       (github.event_name == 'push' &&
        github.ref == 'refs/heads/lane20/unattended-supervisor-20261031'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read only supervisor source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python stdlib runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline fail-closed policy regression tests
        run: python -m unittest discover -s backend/scripts -p test_rrgh_map_supervisor.py -v
      - name: Inspect GitHub independent recovery without any cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERVISOR_OUTPUT_FILE: ${{ runner.temp }}/rrgh-verified-recovery.json
        run: python backend/scripts/rrgh_map_supervisor.py
      - name: Checkout prior source into isolated local planning workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane20/unattended-supervisor-20261031'
        uses: actions/checkout@v4
        with:
          ref: b1730500f383fe2b7e691179022dd7789b414f00
          path: source-checkout
          persist-credentials: false
      - name: Install locked map dependency set for offline scope QA
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane20/unattended-supervisor-20261031'
        run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Dry-run next immutable wave from exact recovered receipt — NO CLOUD AND NO WRITES
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane20/unattended-supervisor-20261031'
        run: |
          python .github/automation/rrgh_prepare_next_wave.py source-checkout "${{ runner.temp }}/rrgh-verified-recovery.json"
          test -f source-checkout/backend/config/gorge-campaign-wave-022-20261031/PLAN.json
          echo "AUTO_PLANNER_LOCAL_ONLY: validated; no GitHub branch updates and no Cloud production"
      - name: Verify atomic publication preconditions against current GitHub source ref — READ ONLY
        if: github.event_name == 'push' && github.ref == 'refs/heads/lane20/unattended-supervisor-20261031'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/automation/rrgh_publish_next_wave.py source-checkout "${{ runner.temp }}/rrgh-verified-recovery.json"
          echo "PUBLISHER_DRY_RUN_ONLY: no commits and no workflow dispatch"


