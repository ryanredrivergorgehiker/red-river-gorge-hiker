name: RRGH cross-wave production integration QA
on:
  push:
    branches: [lane20/verified-crosswave-reader-20261109]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: renderer-source
jobs:
  production-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2c121dfba317d918749acaadd6842be81c88fee1
          path: renderer-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5566a6885eadfad16a8548a58907b6a8805cfe55
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Four layer production, immutable source reads, independent recomputation and corruption gates
        run: python -m unittest discover -s .github/automation -p 'test_rrgh_crosswave*.py' -v
      - name: Real settled source to fresh pilot, trusted publication and once-only phase closure
        run: python .github/automation/verify_rrgh_crosswave_roundtrip.py source-checkout
      - name: Preserve published-successor and handoff recovery paths
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_published_successor.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_completion_throughput.py -v
