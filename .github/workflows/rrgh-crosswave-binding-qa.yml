name: RRGH cross-wave dependency binding QA
on:
  push:
    branches: [lane20/verified-crosswave-reader-20261109]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: source-checkout
jobs:
  offline-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2c121dfba317d918749acaadd6842be81c88fee1
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Real compact codecs, immutable ranges, four original layer renderers and faults
        run: python -m unittest discover -s .github/automation -p test_rrgh_crosswave_dependencies.py -v
      - name: Acquire actual immutable receipt bindings across accepted historical waves
        run: python .github/automation/verify_rrgh_crosswave_binding.py source-checkout
