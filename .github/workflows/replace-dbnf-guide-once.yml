name: Replace DBNF camping guide once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-dbnf-guide-once.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download and verify approved guide
        shell: bash
        run: |
          set -euo pipefail
          target="public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf"
          tmp="${target}.new"
          curl -L --fail --retry 5 --retry-all-errors \
            -o "$tmp" \
            "https://drive.usercontent.google.com/download?id=1yMlbOUtBQN-vWjwlWfDE5ui1ziVZrkWg&export=download&confirm=t"
          test "$(stat -c%s "$tmp")" = "11285602"
          echo "fcac416e6a818386393398f5efd8db8439aba2a8df48673f30ff1d491e28a1ab  $tmp" | sha256sum -c -
          test "$(head -c 5 "$tmp")" = "%PDF-"
          mv "$tmp" "$target"

      - name: Commit approved replacement and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/replace-dbnf-guide-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf .github/workflows/replace-dbnf-guide-once.yml
          git commit -m "Replace DBNF dispersed camping guide PDF"
          git push origin HEAD:main
