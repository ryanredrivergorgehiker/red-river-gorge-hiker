name: RRGH automated restricted map producer
run-name: RRGH ${{ inputs.mode == 'package' && 'package' || inputs.mode == 'produce' && 'production' || inputs.mode == 'recover' && 'recovery' || inputs.mode == 'inspect' && 'inspection' || inputs.mode == 'salvage' && 'salvage' || inputs.mode == 'complete' && 'completion' || inputs.mode == 'checkpoints' && 'checkpoints' || 'probe' }} ${{ inputs.sequence }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [probe, produce, recover, inspect, salvage, complete, checkpoints, package]
        required: true
      source_sha:
        type: string
        required: true
      plan_sha256:
        type: string
        required: true
      sequence:
        type: string
        required: true
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_SOURCE_SHA: ${{ inputs.source_sha }}
  RRGH_PLAN_SHA256: ${{ inputs.plan_sha256 }}
  RRGH_DISPATCH_ID: ${{ inputs.dispatch_id }}
jobs:
  admit:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Atomically claim the exact controller allocation before Cloud authentication
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_SEQUENCE: ${{ inputs.sequence }}
          INPUT_DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: python .github/automation/rrgh_dispatcher.py claim
  authentication-probe:
    needs: admit
    if: inputs.mode == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Verify source identity, exact protected predecessor and unused allocation without Cloud writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py probe --source source-checkout
  checkpoint-inspection:
    needs: admit
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Inspect only exact known checkpoint objects without Cloud writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: RRGH_SEED_READER_PREFLIGHT=1 python .github/automation/rrgh_checkpoint_diagnostics.py source-checkout
  finish-inspection:
    needs: [admit, checkpoint-inspection]
    if: always() && inputs.mode == 'inspect' && needs.admit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py finish-inspection
  activate:
    needs: [admit, authentication-probe]
    if: inputs.mode == 'probe' && needs.authentication-probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Automatically dispatch first production after authenticated readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py activate
  parallel-render-trial:
    needs: admit
    if: inputs.mode == 'produce' && inputs.sequence == '261'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e6a2e6ccf0a8a8de8efcd958f83587291b14ee83
          path: trial-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r trial-source/backend/scripts/requirements-gorge-benchmark.txt
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Compare real verified-child renders in isolated private scratch with bounded Cloud reads
        env:
          RRGH_TRIAL_SEQUENCE: ${{ inputs.sequence }}
          RRGH_TRIAL_SOURCE_SHA: e6a2e6ccf0a8a8de8efcd958f83587291b14ee83
        run: python .github/automation/rrgh_cloud_render_trial.py trial-source
  bounded-stage:
    needs: admit
    if: inputs.mode == 'produce'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    permissions:
      contents: read
      id-token: write
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Validate exact source, immutable plan, resource reservations and budget before credentials
        run: python backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Produce only the claimed fresh allocation with per-job ownership checks
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: python backend/scripts/gorge_campaign.py --phase produce
  independent-recovery:
    needs: [admit, bounded-stage]
    if: >-
      always() && github.run_attempt == 1 && needs.admit.result == 'success' &&
      ((inputs.mode == 'produce' && needs.bounded-stage.outputs.worker_receipt == 'true') || inputs.mode == 'recover')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - run: python backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently recover pixels, hashes, packages and cache lineage on a fresh runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python backend/scripts/gorge_campaign.py --phase recovery
  independent-salvage:
    needs: admit
    if: inputs.mode == 'salvage'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Recover inspected checkpoints and source pins without repeating source work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_checkpoint_salvage.py source-checkout
  independent-checkpoints:
    needs: admit
    if: inputs.mode == 'checkpoints'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently inspect and recover saved native checkpoints without source requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_checkpoint_recovery.py source-checkout
  independent-completion:
    needs: admit
    if: inputs.mode == 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Complete saved output verification with a new allocation and no source work
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_checkpoint_completion.py source-checkout
  advance:
    needs: [admit, bounded-stage, independent-recovery, independent-salvage, independent-completion, independent-checkpoints]
    if: >-
      always() && needs.admit.result == 'success' &&
      ((inputs.mode == 'checkpoints' && needs.independent-checkpoints.result == 'success') ||
       (inputs.mode == 'complete' && needs.independent-completion.result == 'success') ||
       (inputs.mode == 'salvage' && needs.independent-salvage.result == 'success') ||
       (needs.independent-recovery.result == 'success' &&
        ((inputs.mode == 'produce' && needs.bounded-stage.result == 'success') || inputs.mode == 'recover')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify actual producer and independent recovery before planning
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py audit --output "${{ runner.temp }}/recovery.json"
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Plan a fresh immutable successor without a GitHub credential in the source process
        run: python .github/automation/rrgh_prepare_dispatch_successor.py source-checkout "${{ runner.temp }}/recovery.json"
      - run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - name: Atomically publish exact successor source and automatically dispatch it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py publish --source source-checkout --audit "${{ runner.temp }}/recovery.json"
  package-stage:
    needs: admit
    if: inputs.mode == 'package'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Assemble one exact funded operation from accepted immutable bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_package_runtime.py source-checkout stage
  package-verify:
    needs: [admit, package-stage]
    if: inputs.mode == 'package' && needs.package-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently read back and verify every newly packaged member
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_package_runtime.py source-checkout verify
  package-advance:
    needs: [admit, package-stage, package-verify]
    if: inputs.mode == 'package' && needs.package-verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify both independent job receipts and allocate the exact successor
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_package_controller.py finish source-checkout
  retain-failure:
    needs: [admit, authentication-probe, activate, bounded-stage, independent-recovery, independent-salvage, independent-completion, independent-checkpoints, advance, package-stage, package-verify, package-advance]
    if: >-
      always() && needs.admit.result == 'success' &&
      (needs.package-stage.result == 'failure' || needs.package-verify.result == 'failure' || needs.package-advance.result == 'failure' ||
       needs.authentication-probe.result == 'failure' || needs.activate.result == 'failure' ||
       needs.bounded-stage.result == 'failure' || needs.independent-recovery.result == 'failure' ||
       needs.independent-checkpoints.result == 'failure' || needs.independent-salvage.result == 'failure' || needs.independent-completion.result == 'failure' || needs.advance.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve ambiguous allocations and stop without replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py failed
  package-recover:
    needs: [admit, package-stage, package-verify, package-advance, retain-failure]
    if: >-
      always() && inputs.mode == 'package' && needs.admit.result == 'success' &&
      needs.retain-failure.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Reconcile verified handoff or fund a bounded fresh transport recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_package_controller.py recover source-checkout
  resume-handoff:
    needs: [admit, bounded-stage, independent-recovery, independent-checkpoints, advance, retain-failure]
    if: >-
      always() && needs.admit.result == 'success' && needs.retain-failure.result == 'success' &&
      ((inputs.mode == 'produce' && needs.bounded-stage.result == 'success' &&
        needs.independent-recovery.result == 'success' && needs.advance.result == 'failure') ||
       (inputs.mode == 'produce' && needs.bounded-stage.result == 'failure' && needs.independent-recovery.result == 'skipped') ||
       (inputs.mode == 'checkpoints' && needs.independent-checkpoints.result == 'success' && needs.advance.result == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reserve only this run's independently verified pending handoff
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_handoff.py prepare --audit "$RUNNER_TEMP/recovery.json"
      - uses: actions/checkout@v4
        if: steps.handoff.outputs.active == 'true'
        with:
          ref: ${{ steps.handoff.outputs.source }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: steps.handoff.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Prepare the fresh successor without GitHub credentials or Cloud access
        if: steps.handoff.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
          python .github/automation/rrgh_prepare_dispatch_successor.py source-checkout "$RUNNER_TEMP/recovery.json"
          python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - name: Revalidate recovery and dispatch a fresh allocation
        if: steps.handoff.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_handoff.py publish --source source-checkout --audit "$RUNNER_TEMP/recovery.json"
      - name: Retain pending recovery or unresolved publication on failure
        if: failure() && steps.handoff.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_handoff.py release
