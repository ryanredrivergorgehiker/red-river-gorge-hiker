name: RRGH automated restricted map producer (disabled until controller approval)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable source+plan commit SHA
        required: true
        type: string
      plan_sha256:
        description: Exact immutable plan SHA256
        required: true
        type: string
      sequence:
        description: Monotone campaign wave sequence
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.event_name == 'workflow_dispatch' &&
      github.actor == 'github-actions[bot]' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 175
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - name: Checkout exact supplied SHA without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify SHA and plan before Google authentication
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          INPUT_SEQUENCE: ${{ inputs.sequence }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re,subprocess,sys,urllib.request
          sys.path.insert(0,'backend/scripts')
          from gorge_campaign import configuration
          from gorge_checkpoint import canonical,digest
          expect=os.environ['INPUT_SOURCE_SHA']
          plan_sha=os.environ['INPUT_PLAN_SHA256']
          seq=os.environ['INPUT_SEQUENCE']
          assert re.fullmatch(r'[0-9a-f]{40}',expect),'Bad source SHA'
          assert re.fullmatch(r'[0-9a-f]{64}',plan_sha),'Bad immutable plan SHA'
          assert re.fullmatch(r'[1-9][0-9]*',seq),'Bad sequence'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expect,'Wrong checkout'
          repo='ryanredrivergorgehiker/red-river-gorge-hiker'
          branch='lane20/map-producer-iam-design-20261029'
          url='https://api.github.com/repos/'+repo+'/git/ref/heads/'+branch
          request=urllib.request.Request(url,headers={
             'Authorization':'Bearer '+os.environ['GH_TOKEN'],
             'Accept':'application/vnd.github+json',
             'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=25) as res:
              head=json.load(res)['object']['sha']
          assert head==expect,'Engineering source branch changed; stop'
          plan,env,region=configuration()
          assert plan['campaign']['sequence']==int(seq),'Wrong wave'
          assert digest(canonical(plan))==plan_sha,'Wrong plan'
          assert env['cloudStorageAllowance']['planSHA256']==plan_sha,'Wrong allowance'
          assert len(plan['approvedJobIDs'])<=512 and len(set(plan['approvedJobIDs']))==len(plan['approvedJobIDs'])
          assert plan['maxConcurrency']==1 and plan['automaticRetryPermitted'] is False
          assert plan['bucket']=='rrgh-nonproduction-protected-packages'
          print(json.dumps({'gate':'passed','sequence':int(seq),'jobs':len(plan['approvedJobIDs']),
                            'planSHA256':plan_sha},sort_keys=True))
          PY
          python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate restricted keyless Cloud identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Existing Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Produce a single source-local bounded wave
        id: producer
        run: python backend/scripts/gorge_campaign.py --phase produce
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.worker_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Validate exact same immutable recovery allocation
        run: python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate existing restricted Cloud identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Recover and independently verify all committed outputs
        run: python backend/scripts/gorge_campaign.py --phase recovery
