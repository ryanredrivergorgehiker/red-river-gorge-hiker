name: Phase 4 store integration temp

on:
  push:
    branches:
      - uat/gear-four-products-20260828
    paths:
      - .phase4-store-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: uat/gear-four-products-20260828
          fetch-depth: 0
      - name: Apply migration
        run: python3 .github/scripts/phase4_store_migrate.py
      - name: Run repository contract tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -p "test*.py" -v
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full website checks
        run: npm run check
      - name: Commit candidate and remove temporary migration controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f .phase4-store-trigger .github/workflows/phase4-store-integration-temp.yml .github/scripts/phase4_store_migrate.py
          git config user.name "ryanredrivergorgehiker"
          git config user.email "ryan@redrivergorgehiker.com"
          git add -A
          git status --short
          git commit -m "UAT: integrate branded Pixels Store"
          git push origin HEAD:uat/gear-four-products-20260828
