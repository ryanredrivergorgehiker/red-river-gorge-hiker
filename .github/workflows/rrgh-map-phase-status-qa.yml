name: RRGH verified phase status QA
on:
  push:
    branches: [lane20/verified-phase-status-20261110]
permissions:
  contents: read
jobs:
  status-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/automation -p test_rrgh_map_status.py -v
