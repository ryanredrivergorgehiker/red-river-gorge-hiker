name: Lane20 exact bounded owner consent plan - read only
on:
  push:
    branches: [lane20/owner-consent-calculation-20261117]
    paths:
      - .github/automation/rrgh_owner_consent_exact_calculation_read_only_20261117.py
      - .github/workflows/rrgh-owner-consent-calculation-read-only-qa.yml
permissions:
  contents: read
concurrency:
  group: rrgh-exact-owner-consent-calc-no-cloud
  cancel-in-progress: false
jobs:
  calculate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.github/automation:accepted-source/backend/scripts'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: d17d0e335ac47e1f6d116e149992cc02d6e4a827
          path: accepted-source
          persist-credentials: false
      - name: Install original frozen benchmark dependencies
        run: python -m pip install --disable-pip-version-check -r accepted-source/backend/scripts/requirements-gorge-benchmark.txt
      - name: Calculate consent plan hash and budget - NO token or Cloud
        run: python .github/automation/rrgh_owner_consent_exact_calculation_read_only_20261117.py
# Zero OIDC, Cloud, API mutations, GH_TOKEN, Cloud creds, approval file, or IAM.
# Branch is a disposable review branch and MUST NOT be merged into working branch.
