name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      task:
        description: Task to run
        required: true
        default: test
        type: choice
        options:
          - test

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' || inputs.task == 'test' }}
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -p "test*.py" -v

  build:
    if: ${{ github.event_name == 'pull_request' || inputs.task == 'test' }}
    name: Astro build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Run checks
        run: npm run check
