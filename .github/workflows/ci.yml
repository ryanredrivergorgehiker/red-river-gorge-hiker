name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run repository contract tests
        run: python3 -m unittest discover -s tests -p "test*.py" -v

  build:
    name: Astro build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Seed validated Skybridge elevation cache
        shell: bash
        run: |
          route_json_blob="$(git rev-parse HEAD:src/data/routes/skybridge-arch.json)"
          route_geo_blob="$(git rev-parse HEAD:public/data/routes/skybridge-arch-v1.geojson)"
          route_gpx_blob="$(git rev-parse HEAD:public/downloads/routes/Skybridge_Arch_APPROVED_v1.gpx)"

          if [ "$route_json_blob" != "e266e780e578edf2d2f93134f01a571e08057f59" ] \
            || [ "$route_geo_blob" != "7845938e72579cde013178f9eaceb7dba9fb8234" ] \
            || [ "$route_gpx_blob" != "0e9575f0d5567f70ccc1701ab72c40992afc4628" ]; then
            echo "Route inputs changed; refusing to reuse cached elevation data." >&2
            exit 1
          fi

          mkdir -p public/data/routes
          cp .ci-cache/skybridge-arch.elevation.json public/data/routes/skybridge-arch.elevation.json
          echo "Seeded validated Skybridge elevation artifact for unchanged route inputs."

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Generate controlled Pinterest Stage 1 catalog feed
        run: node scripts/generate-pinterest-art-catalog.mjs --output-dir public/feeds

      - name: Verify Pinterest catalog contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync('public/feeds/pinterest-art-catalog.csv', 'utf8').trimEnd().split(/\r?\n/);
          if (lines.length !== 47) throw new Error(`Expected header + 46 rows, found ${lines.length} lines`);
          const manifest = JSON.parse(fs.readFileSync('public/feeds/pinterest-art-catalog-manifest.json', 'utf8'));
          if (manifest.itemCount !== 46 || manifest.rows.length !== 46) throw new Error('Pinterest catalog item count mismatch');
          if (!manifest.noGear || manifest.paidCampaignChanged) throw new Error('Pinterest Stage 1 scope boundary failure');
          console.log('Pinterest catalog contract PASS: 46 photography-commerce items, no Gear, no paid change.');
          NODE

      - name: Run checks
        # Live USGS generation is exercised separately when route inputs change.
        # This branch is calibrating map-derived ridge geometry only, so CI uses
        # the guarded last-validated route elevation artifact above.
        run: |
          npm run validate
          npm run validate:routes
          npx astro check
          npm test
          npm run build:site
