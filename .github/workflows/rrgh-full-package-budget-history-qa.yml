name: Lane20 full package budget from independent history (no Cloud)
on:
  push:
    branches: [lane20/full-package-history-budget-20261117]
    paths:
      - .github/automation/fixtures/rrgh-verified-full-layout-budget-evidence-20261117.json
      - .github/automation/test_rrgh_full_package_historical_budget_20261117.py
      - .github/workflows/rrgh-full-package-budget-history-qa.yml
      - docs/engineering/lane20-full-historical-layout-budget-20261117.md
  pull_request:
    branches: [lane20/offline-production-preflight-20261029]
    paths:
      - .github/automation/fixtures/rrgh-verified-full-layout-budget-evidence-20261117.json
      - .github/automation/test_rrgh_full_package_historical_budget_20261117.py
      - .github/workflows/rrgh-full-package-budget-history-qa.yml
      - docs/engineering/lane20-full-historical-layout-budget-20261117.md
permissions:
  contents: read
concurrency:
  group: rrgh-full-layout-historical-budget-source-only
  cancel-in-progress: false
jobs:
  historical-proof:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.github/automation:source/backend/scripts'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: d17d0e335ac47e1f6d116e149992cc02d6e4a827
          path: source
          persist-credentials: false
      - name: Install original frozen, source-only budget dependencies
        run: python -m pip install --disable-pip-version-check -r source/backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify historically authenticated 122-part bound against current retained ledger
        run: python .github/automation/test_rrgh_full_package_historical_budget_20261117.py -v
# NO id-token:write, GH_TOKEN, Cloud token, GCS request, state write, raster
# generation, package dispatch, catalog release, or iOS/tester rollout.
