name: Refresh Kentucky State Park trails cache

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * 1'
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - 'scripts/update_ky_state_park_trails.py'
      - '.github/workflows/refresh-ky-state-park-trails.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install spatial cache dependency
        run: python -m pip install --disable-pip-version-check shapely
      - name: Refresh official Kentucky State Park trails
        run: python scripts/update_ky_state_park_trails.py
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/map/ky-state-park-trails.geojson
          if git diff --cached --quiet; then
            echo "State Park trails cache unchanged."
          else
            git commit -m "Refresh Kentucky State Park trails cache [skip ci]"
            git push
          fi
