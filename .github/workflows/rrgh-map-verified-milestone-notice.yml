name: RRGH verified map wave milestone notification
on:
  workflow_run:
    workflows: ["RRGH bounded source-local map campaign and independent recovery"]
    types: [completed]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: rrgh-verified-map-milestone-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  verified-completion-notice:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'RRGH bounded source-local map campaign and independent recovery' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event.workflow_run.head_branch == 'lane20/offline-production-preflight-20261029' &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate producer AND independent recovery; post one owner-followed issue comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ryanredrivergorgehiker/red-river-gorge-hiker
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.parse
          repo='ryanredrivergorgehiker/red-river-gorge-hiker'
          token=os.environ['GH_TOKEN']
          run_id=int(os.environ['RUN_ID'])
          run_url=f'https://github.com/{repo}/actions/runs/{run_id}'
          if os.environ['RUN_URL']!=run_url:
              raise SystemExit('Unexpected run URL; fail closed')
          def api(method,path,body=None):
              url='https://api.github.com/repos/'+repo+'/'+path
              req=urllib.request.Request(url,method=method,
                   data=(json.dumps(body).encode() if body is not None else None),
                   headers={'Authorization':'Bearer '+token,
                            'Accept':'application/vnd.github+json',
                            'X-GitHub-Api-Version':'2022-11-28',
                            'User-Agent':'RRGH-GitHub-native-verified-milestone',
                            **({'Content-Type':'application/json'} if body is not None else {})})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.load(r)
          run=api('GET',f'actions/runs/{run_id}')
          msg=(run.get('head_commit') or {}).get('message') or ''
          match=re.fullmatch(r'Lane20: execute verified new-territory wave(\d{3}) 20261031',msg)
          if not (run.get('status')=='completed' and run.get('conclusion')=='success'
                  and run.get('run_attempt')==1 and run.get('head_branch')=='lane20/offline-production-preflight-20261029'
                  and run.get('event')=='push' and match and
                  run.get('head_sha')==os.environ['HEAD_SHA']):
              raise SystemExit('Not one fully completed authorized map production wave')
          jobs=api('GET',f'actions/runs/{run_id}/jobs?per_page=100')
          if jobs.get('total_count',101)>100:
              raise SystemExit('Job pagination exceeded safety scope')
          names={j['name']:j.get('conclusion') for j in jobs.get('jobs',[])}
          if names.get('bounded-stage')!='success' or names.get('independent-recovery')!='success':
              raise SystemExit('Producer/recovery not both independently successful')
          comments=api('GET','issues/72/comments?per_page=100')
          marker=f'RRGH-VERIFIED-RUN-ID:{run_id}'
          if any(marker in x.get('body','') for x in comments):
              print('Previously notified '+marker);raise SystemExit(0)
          wave=match.group(1)
          message=(f'### Wave {wave} — producer AND independent recovery succeeded\n\n'
                   f'GitHub production and recovery: {run_url}\n\n'
                   f'GitHub run attempt: 1; approved original restricted push branch; exact source commit: {os.environ["HEAD_SHA"]}.\n'
                   'Both producer and independent-recovery jobs completed successfully. '
                   'For authoritative accepted jobs, raster tile count, package counts, pixel hashes and cost '
                   'read the independent-recovery receipt and log. These counts are NOT guessed in this notification.\n\n'
                   'The next wave is not guaranteed to have started; check the GitHub Actions run list for the next producer.\n\n'
                   f'<!-- {marker} -->')
          api('POST','issues/72/comments',{'body':message})
          print('NEW_VERIFIED_WAVE_MILESTONE_ISSUE_NOTICE: Wave '+wave+' '+run_url)
          PY
