name: Refresh NOAA weather overlays

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - 'scripts/update_weather_overlays.py'
      - '.github/workflows/refresh-weather-overlays.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh RRGH-hosted NOAA weather overlays
        run: python scripts/update_weather_overlays.py
      - name: Commit refreshed weather cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/map/weather
          if git diff --cached --quiet; then
            echo "Weather overlays unchanged."
          else
            git commit -m "Refresh NOAA weather overlays [skip ci]"
            git push
          fi
