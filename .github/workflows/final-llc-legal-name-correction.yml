name: Final LLC legal-name correction helper

on:
  push:
    branches:
      - uat/llc-website-transition-20260822

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact UAT branch
        uses: actions/checkout@v6
        with:
          ref: uat/llc-website-transition-20260822
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Apply exact legal-name and Privacy-date correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'Red River Gorge Hiker LLC'
          new = 'Red River Gorge Hiker, LLC'
          changed = []

          for root in (Path('src'), Path('tests')):
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      text = text.replace(old, new)
                      path.write_text(text, encoding='utf-8')
                      changed.append(str(path))

          privacy = Path('src/pages/privacy.astro')
          text = privacy.read_text(encoding='utf-8')
          old_date = 'Last updated: August 19, 2026'
          new_date = 'Last updated: August 26, 2026'
          if text.count(old_date) != 1:
              raise SystemExit(f'Expected exactly one old Privacy date, found {text.count(old_date)}')
          privacy.write_text(text.replace(old_date, new_date), encoding='utf-8')
          if str(privacy) not in changed:
              changed.append(str(privacy))

          print('Changed files:')
          for path in sorted(set(changed)):
              print(path)

          # Exact required footer result.
          footer = Path('src/components/Footer.astro').read_text(encoding='utf-8')
          assert '<strong>© Red River Gorge Hiker, LLC.</strong>' in footer
          assert '<span>All rights reserved. Photographs © Ryan D. Lewis.</span>' in footer
          assert 'Operated by Red River Gorge Hiker' not in footer

          # Exact required website schema while preserving the public brand.
          base = Path('src/layouts/Base.astro').read_text(encoding='utf-8')
          assert "name: 'Red River Gorge Hiker'," in base
          assert "copyrightHolder: { '@type': 'Organization', name: 'Red River Gorge Hiker, LLC' }," in base
          assert "publisher: { '@type': 'Organization', name: 'Red River Gorge Hiker, LLC' }" in base

          # Privacy exact date and operator references.
          privacy_text = privacy.read_text(encoding='utf-8')
          assert new_date in privacy_text
          assert old_date not in privacy_text
          assert 'RedRiverGorgeHiker.com is operated by Red River Gorge Hiker, LLC under the Red River Gorge Hiker brand.' in privacy_text
          assert 'may be retained by Red River Gorge Hiker, LLC when reasonably useful' in privacy_text

          # Photograph ownership/schema/copyright locks.
          photo = Path('src/pages/photographs/[slug].astro').read_text(encoding='utf-8')
          assert "creator: { '@type': 'Person', name: 'Ryan D. Lewis' }" in photo
          assert "copyrightHolder: { '@type': 'Person', name: 'Ryan D. Lewis' }" in photo
          assert 'Photographs © Ryan D. Lewis. All rights reserved.' in photo
          assert 'Red River Gorge Hiker, LLC' not in photo
          assert 'Red River Gorge Hiker LLC' not in photo

          # Search & Rescue financial/data invariants.
          sar = Path('src/pages/search-and-rescue.astro').read_text(encoding='utf-8')
          assert '20% of RRGH business profit is allocated to Wolfe County Search & Rescue.' in sar
          for invariant in (
              'sar.personalAnnualCommitment', 'sar.rrghSarGenerated', 'sar.rrghSarDonated',
              'sar.outstandingCommitment', 'sar.annualCombinedSupport', 'sar.historicalPersonalSupport',
              'sar.lifetimePersonalSupport', 'sar.lifetimeRrghSupport', 'sar.lifetimeRrghTransferred',
              'sar.combinedLifetimeSupport', 'sar.matchPercentage', 'sar.lastUpdated'
          ):
              assert invariant in sar

          # Repository-wide zero-obsolete-string check within candidate source/tests.
          remaining = []
          for root in (Path('src'), Path('tests')):
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if old in text:
                      remaining.append(str(path))
          if remaining:
              raise SystemExit('Obsolete legal-name string remains in: ' + ', '.join(remaining))
          PY

      - name: Verify photograph page remains untouched by this correction
        run: |
          git diff --exit-code HEAD^ -- 'src/pages/photographs/[slug].astro'

      - name: Run complete repository contract tests
        run: python3 -m unittest discover -s tests -p "test*.py" -v

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Run normal production-equivalent checks/build
        run: npm run check

      - name: Commit exact corrected candidate and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/final-llc-legal-name-correction.yml
          git add src tests
          echo 'Final correction diff:'
          git diff --cached --stat
          git diff --cached --name-only
          git commit -m 'Correct final LLC legal name and Privacy date'
          git push origin HEAD:uat/llc-website-transition-20260822
