name: Finalize puzzle overview implementation once

on:
  push:
    branches:
      - 'feature/aug12-analytics-pricing-puzzles-sharing'
    paths:
      - '.github/workflows/finalize-puzzle-overviews-once.yml'

permissions:
  contents: write

jobs:
  finalize-puzzle-overviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: 'feature/aug12-analytics-pricing-puzzles-sharing'
          fetch-depth: 0

      - name: Update legacy puzzle asset contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_site_contract.py')
          text = path.read_text()
          first = "        puzzles = (ROOT / 'src/pages/puzzles.astro').read_text()\n        expected = {"
          replacement = "        puzzles = (ROOT / 'src/pages/puzzles.astro').read_text()\n        detail = (ROOT / 'src/pages/puzzles/[slug].astro').read_text()\n        expected = {"
          if first not in text:
              raise RuntimeError('Puzzle contract header not found')
          text = text.replace(first, replacement, 1)
          old_assert = "            self.assertIn(filename, puzzles)\n\n    def test_legal_copy_and_footer_notice"
          new_assert = "            self.assertIn(filename, detail)\n\n    def test_legal_copy_and_footer_notice"
          if old_assert not in text:
              raise RuntimeError('Puzzle contract assertion not found')
          text = text.replace(old_assert, new_assert, 1)
          path.write_text(text)
          PY

      - name: Remove completed generator workflow
        run: rm -f .github/workflows/generate-puzzle-overviews-once.yml

      - name: Commit final cleanup
        run: |
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize standardized puzzle overview implementation'
          git push origin HEAD:feature/aug12-analytics-pricing-puzzles-sharing
