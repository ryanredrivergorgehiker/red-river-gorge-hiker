name: Generate Clifty 1000-1100 ft sun test overlay
# Owner-UAT regeneration trigger: isolated test layer; accepted 1100+ files remain locked.

on:
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - scripts/generate-clifty-sun-test.py
      - .github/workflows/generate-clifty-sun-test.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clifty-sun-1000-1100-test
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: staging/routes-tracks-interactive-map

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install terrain-only generator dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 rasterio==1.5.1 pyproj==3.8.0 shapely==2.1.2 requests==2.34.2

      - name: Fingerprint accepted 1100+ layer before test generation
        shell: bash
        run: |
          sha256sum public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/*.geojson | sort > /tmp/accepted-sun-before.sha256

      - name: Generate isolated Clifty staging test supplement
        run: python scripts/generate-clifty-sun-test.py

      - name: Prove accepted 1100+ layer is untouched
        shell: bash
        run: |
          sha256sum public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/*.geojson | sort > /tmp/accepted-sun-after.sha256
          diff -u /tmp/accepted-sun-before.sha256 /tmp/accepted-sun-after.sha256
          test -z "$(git status --porcelain -- public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/)"

      - name: Commit test-only deterministic outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/map/clifty-sun-1000-1100-test-manifest.json public/data/map/clifty-sun-1000-1100-test/
          if git diff --cached --quiet; then
            echo "Clifty 1000-1100 ft test overlay already current."
          else
            git commit -m "Generate isolated Clifty 1000-1100 ft sun test overlay"
            git push
          fi
