name: Lane20 immutable regional catalog — one-shot authenticated READ ONLY
on:
  push:
    branches:
      - lane20/nonprod-regional-catalog-generation-gate-20261118
    paths:
      - .github/workflows/rrgh-regional-catalog-remote-readonly-20261118.yml

permissions:
  contents: read

concurrency:
  group: lane20-one-shot-regional-catalog-readback-20261118
  cancel-in-progress: false

jobs:
  verify-real-private-candidate:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/nonprod-regional-catalog-generation-gate-20261118' &&
      github.event_name == 'push' &&
      github.actor == 'ryanredrivergorgehiker' &&
      github.triggering_actor == 'ryanredrivergorgehiker' &&
      github.run_attempt == 1 &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: backend/scripts
    steps:
      - name: Checkout reviewed private map controller without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unchanged reviewed controller and bounded no-write source unit tests
        run: |
          test "$(git hash-object .github/automation/rrgh-controller-state.json)" = "04bd859c55d981cbacdc259ea59ba8d4ae12e459"
          python3 -m py_compile backend/scripts/verify_remote_regional_candidate_readonly_20261118.py backend/scripts/test_verify_remote_regional_candidate_readonly_20261118.py
          python3 -m unittest discover -s backend/scripts -p 'test_verify_remote_regional_candidate_readonly_20261118.py' -v
      - name: Authenticate using EXISTING nonproduction WIF identity, read-only OAuth scope
        id: cloud_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
      - name: Verify EXACT immutable candidate, checkpoint, receipt, and 125 CURRENT object metadata records
        env:
          RRGH_GCS_READONLY_TOKEN: ${{ steps.cloud_auth.outputs.access_token }}
        run: |
          python3 backend/scripts/verify_remote_regional_candidate_readonly_20261118.py \
            --controller .github/automation/rrgh-controller-state.json

# SECURITY / BUDGET: One trigger path only, no workflow_dispatch, no re-run,
# no GCS listing, no archive object bodies, no object writes, no IAM mutation,
# no Cloud SDK, no Firestore, no releases and no artifacts. In-code ceiling:
# 131 GETs, 3 MiB transferred, 8 minutes maximum.
# This source branch will never activate customers or the catalog.
