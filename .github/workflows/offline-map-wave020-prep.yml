name: RRGH Wave020 new-geography plan (offline, no cloud)
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-wave020-prep.yml]
permissions:
  contents: read
concurrency:
  group: rrgh-wave020-offline-prep
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: validate and publish Wave020 512-job source-backed scope 20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d373ed6eb58af133d50fec52b1c0c430eca5ad2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked map processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Check strict source-gap fault quarantine stays fail-closed
        run: python backend/scripts/test_gorge_source_gap_guard.py -v
      - name: Generate new-geography candidate from original pinned imagery inventory
        shell: bash
        run: |
          python - <<'PY'
          import base64,copy,json,sys,zlib
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'backend/scripts')
          from gorge_checkpoint import canonical,digest
          from gorge_campaign_budget import admit,cost
          from run_gorge_checkpoint_slot import code_snapshot
          from forecast_gorge_checkpoint_campaign import bbox,coords,intersects,morton,PROFILES
          from gorge_campaign import configuration
          
          src=Path('backend/config/gorge-campaign-wave-019-20261031')
          dst=Path('backend/config/gorge-campaign-wave-020-20261031')
          # Canonical source pin is already committed at the exact checkout SHA.
          campaign_py=Path('backend/scripts/gorge_campaign.py')
          assert "CONFIG=SOURCE.parent/'config/gorge-campaign-wave-020-20261031'" in campaign_py.read_text()
          old=json.loads((src/'PLAN.json').read_bytes())
          env=json.loads((src/'ALLOWANCE.json').read_bytes())
          region=json.loads(zlib.decompress(base64.b64decode((src/'REGION-PLAN.json.z.b64').read_bytes())))
          assert old['campaign']['sequence']==19
          assert len(old['completedJobIDs'])==2529 and len(old['approvedJobIDs'])==384
          assert old['approvedJobIDs']==[j['id'] for j in region['jobs']]
          assert Counter(j['layer'] for j in region['jobs'])=={'usgs-topo':192,'leaf-on':192}
          assert sum(len(j['outputTiles']) for j in region['jobs'])==4224
          
          # Wave019 fresh-runner independent recovery independently verified,
          # including hashes, decoded pixels, 7096 seams and 17 package parts.
          recovery={'bytes':1535,'generation':'1793456338972474',
           'key':'engineering/map-production/plans/658b73196efff577962fbe743590b166d094dbf505de331e1cc274819c6ad254/slots/00002/receipt.json',
           'sha256':'d43365a5a23180a961975cb06202110305231e5372e3dd6849bab9833ae3fe26'}
          carry={'chargedUSD':'7.031772495113456249237060548',
           'storedBytes':15359300612,'priorCompletedJobs':2913,
           'priorRasterTiles':29909,'priorSunlightAssets':320}
          accepted=old['completedJobIDs']+old['approvedJobIDs']
          assert len(accepted)==2913 and len(set(accepted))==2913
          prior_attempts=old['priorAttemptCounts'].copy()
          excluded={jid for jid,n in prior_attempts.items() if n>0 and jid not in accepted}
          original_ambiguous='leaf-on-16-17535-25316'
          wave014_ambiguous='leaf-on-16-17556-25323'
          assert old['campaign']['ambiguousExcludedJobs']==[original_ambiguous,wave014_ambiguous]
          assert len(excluded)==45 and original_ambiguous in excluded and wave014_ambiguous in excluded
          assert not set(accepted)&excluded
          for jid in old['approvedJobIDs']:
              assert prior_attempts.get(jid,0)==0
              prior_attempts[jid]=1
          assert all(0<prior_attempts[jid]<=2 for jid in excluded)
          
          # Reconstruct only current-inventory-covered z16 windows; any tile that
          # merely intersects a COG bbox remains subject to full native pixel QA.
          grids={z:coords(z) for z in (16,17,18)}
          index={}
          missing={}
          for group,layers in PROFILES.items():
              for layer,maxz in layers.items():
                  family='dem' if layer=='terrain' else layer
                  sources=region['inventory']['sources'].get(family,[])
                  gaps=0
                  for x,y in sorted(grids[16],key=lambda xy:morton(*xy)):
                      if layer=='usgs-topo':
                          sources_for_job=[]
                      else:
                          box=bbox(16,x,y,1/512 if layer=='terrain' else 0)
                          sources_for_job=[f['id'] for f in sources if intersects(f['bbox'],box)]
                          if not sources_for_job:
                              gaps+=1
                              continue
                      tiles=[]
                      for z in range(16,maxz+1):
                          n=2**(z-16)
                          for dx in range(n):
                              for dy in range(n):
                                  xx,yy=x*n+dx,y*n+dy
                                  if (xx,yy) in grids[z]:tiles.append([z,xx,yy])
                      jid=f'{layer}-16-{x}-{y}'
                      assert tiles and jid not in index
                      index[jid]={'id':jid,'layer':layer,'group':group,'z':16,'x':x,'y':y,
                          'operation':'usgs-tile' if layer=='usgs-topo' else 'source-window',
                          'sourceIDs':sources_for_job,'dependencies':[],'outputTiles':tiles,'preservedComplete':False}
                  missing[layer]=gaps
          assert len(index)==11940 and sum(missing.values())==13960
          for prior in region['jobs']:
              reference=index[prior['id']]
              assert prior['sourceIDs']==reference['sourceIDs']
              assert prior['outputTiles']==reference['outputTiles']
          
          # Proven successful families first; terrain/leaf-off deferred until source
          # pixel-validity survey. Select next unused z16 neighbors of verified tiles.
          # Defer all new hiking plus terrain/leaf-off pending original valid-pixel audit.
          # Topo and leaf-on were previously verified; native checks remain strict.
          limits={'usgs-topo':256,'leaf-on':256}
          selected=[]
          for layer,limit in limits.items():
              landmarks=[index[jid] for jid in accepted if jid in index and index[jid]['layer']==layer]
              assert landmarks
              coords_done=[(j['x'],j['y']) for j in landmarks]
              eligible=[j for j in index.values() if j['layer']==layer
                  and j['id'] not in accepted and j['id'] not in excluded
                  and prior_attempts.get(j['id'],0)==0
                  and (j['sourceIDs'] or layer=='usgs-topo')]
              eligible.sort(key=lambda j:(min(abs(j['x']-x)+abs(j['y']-y) for x,y in coords_done),
                                          morton(j['x'],j['y']),j['id']))
              pick=eligible[:limit]
              assert len(pick)==limit,(layer,len(pick))
              pick.sort(key=lambda j:(tuple(j['sourceIDs']),morton(j['x'],j['y']),j['id']))
              selected.extend(pick)
          
          ids=[j['id'] for j in selected]
          assert len(ids)==512 and len(set(ids))==512
          assert not set(ids)&(set(accepted)|excluded)
          assert Counter(j['layer'] for j in selected)==limits
          expected_tiles=sum(len(j['outputTiles']) for j in selected)
          assert expected_tiles==5632,(expected_tiles,len(ids))
          
          # Same established conservative funding envelope, new immutable sequence.
          plan=copy.deepcopy(old)
          plan['campaign']['sequence']=20
          plan['campaign']['previousRecovery']=recovery
          plan['campaign']['carry']=carry
          plan['campaign']['ambiguousExcludedJobs']=[original_ambiguous,wave014_ambiguous]
          plan['completedJobIDs']=accepted
          plan['expiresAt']='2026-11-11T00:00:00Z'
          plan['approvedJobIDs']=ids
          plan['slotJobs']={'1':ids}
          plan['priorAttemptCounts']=prior_attempts
          assert all(prior_attempts[jid]>=1 for jid in excluded)
          assert all(0<=v<=2 for v in prior_attempts.values())
          assert not set(plan['completedJobIDs'])&set(plan['approvedJobIDs'])
          
          # Inherit exactly the per-layer guardrails from already-accepted jobs.
          bylayer={}
          for jid,policy in old['jobPolicies'].items():
              layer=jid.rsplit('-',3)[0]
              if layer in bylayer:assert bylayer[layer]==policy
              else:bylayer[layer]=policy
          for jid in accepted:
              if jid.rsplit('-',3)[0]=='hiking':
                  # Historical policy is retained in Wave005 (not regenerated).
                  pass
          wave005=json.loads(Path('backend/config/gorge-campaign-wave-005-20261030/PLAN.json').read_bytes())
          for jid,policy in wave005['jobPolicies'].items():
              layer=jid.rsplit('-',3)[0]
              if layer in bylayer:assert bylayer[layer]==policy
              else:bylayer[layer]=policy
          assert all(l in bylayer for l in limits)
          plan['jobPolicies']={j['id']:bylayer[j['layer']] for j in selected}
          plan['slots'][1]['attempts']=512
          plan['limits']['attempts']=512
          assert plan['slots'][1]['classARequests']==2000
          assert 3*len(ids)+32<plan['slots'][1]['classARequests'], 'No Class-A headroom for enlarged wave'
          region['jobs']=selected
          # These two reviewed modules changed since the Wave011 source pin:
          # canonical bootstrap now accepts the verified salvage lineage; token
          # reuse is already independently regression-tested. All remaining
          # engine hashes stay pinned to their prior immutable values.
          for changed in ('gorge_campaign.py','run_gorge_checkpoint_slot.py'):
              assert changed in region['engineHashes']
              region['engineHashes'][changed]=digest((Path('backend/scripts')/changed).read_bytes())
          plan['regionPlanSHA256']=digest(canonical(region))
          plan['sourceSnapshotSHA256']=code_snapshot(Path('backend/scripts'))
          env['cloudStorageAllowance']['approvedUSD']='0.6456'
          env['cloudStorageAllowance']['reservedWorstCaseUSD']=str(cost(plan['limits']))
          env['cloudStorageAllowance']['planSHA256']=digest(canonical(plan))
          ad=admit(plan,env)
          assert ad['reserveUSD']==env['cloudStorageAllowance']['reservedWorstCaseUSD']
          assert float(ad['cumulativeAdmissionUSD'])<25
          assert float(ad['monthlyAdmissionUSD'])<1
          dst.mkdir(parents=True,exist_ok=False)
          (dst/'PLAN.json').write_bytes(canonical(plan))
          (dst/'ALLOWANCE.json').write_bytes(canonical(env))
          (dst/'REGION-PLAN.json.z.b64').write_bytes(base64.b64encode(zlib.compress(canonical(region),9)))
          p,e,r=configuration(dst)
          assert p['completedJobIDs']==accepted and p['approvedJobIDs']==ids
          assert p['campaign']['previousRecovery']==recovery
          assert p['campaign']['carry']==carry
          assert p['campaign']['ambiguousExcludedJobs']==[original_ambiguous,wave014_ambiguous]
          assert p['sourceSnapshotSHA256']==code_snapshot(Path('backend/scripts'))
          assert p['regionPlanSHA256']==digest(canonical(r))
          print(json.dumps({'phase':'verified-offline-wave020','jobs':len(ids),'controlledExpansion':'512 = 256 topo + 256 leaf-on, max authorized by campaign governor; 2000 producer Class-A cap and all45 exclusions unchanged',
           'tiles':expected_tiles,'previouslyRecoveredJobs':len(accepted),
           'exclusions':sorted(excluded),'transportAmbiguousExcluded':[original_ambiguous,wave014_ambiguous],
           'sourceWindowGapsByLayer':missing,'planSHA256':digest(canonical(p)),
           'sourceSnapshotSHA256':p['sourceSnapshotSHA256'],'admission':ad},sort_keys=True))
          PY
      - name: Publish only validated immutable scope without persisting checkout credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          import requests
          
          repo='ryanredrivergorgehiker/red-river-gorge-hiker'
          branch='lane20/map-producer-iam-design-20261029'
          expected='5d373ed6eb58af133d50fec52b1c0c430eca5ad2'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='5d373ed6eb58af133d50fec52b1c0c430eca5ad2'
          token=os.environ['GH_TOKEN']
          assert token
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          base='https://api.github.com/repos/'+repo+'/'
          def api(method,path,payload=None):
              response=requests.request(method,base+path,headers=headers,json=payload,timeout=45)
              if not response.ok:
                  raise RuntimeError('GitHub API '+method+' '+path.split('?')[0]+' HTTP '+str(response.status_code))
              return response.json()
          current=api('GET','git/ref/heads/'+branch)['object']['sha']
          assert current==expected,'Source branch changed; fail closed'
          parent=api('GET','git/commits/'+expected)
          paths=['ALLOWANCE.json','PLAN.json','REGION-PLAN.json.z.b64']
          prefix='backend/config/gorge-campaign-wave-020-20261031/'
          entries=[]
          for name in paths:
              path=Path(prefix+name)
              assert path.is_file() and path.stat().st_size>0
              entries.append({'path':str(path),'mode':'100644','type':'blob',
                              'content':path.read_text(encoding='utf-8')})
          tree=api('POST','git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('POST','git/commits',{
              'message':'Lane20: persist verified wave020 source-backed successor [skip ci]',
              'tree':tree['sha'],'parents':[expected]})
          api('PATCH','git/refs/heads/'+branch,{'sha':commit['sha'],'force':False})
          check=api('GET','git/ref/heads/'+branch)['object']['sha']
          assert check==commit['sha'],'Commit ref readback mismatch'
          # Confirm intended Wave020 tree paths are actually published.
          tree_items=api('GET','git/trees/'+commit['sha']+'?recursive=1')['tree']
          published={item['path'] for item in tree_items if item['type']=='blob'}
          assert all(prefix+name in published for name in paths),'Wave020 immutable files absent from committed tree'
          print(json.dumps({'status':'immutable-wave020-published','commit':check,
                            'files':len(paths),'sourceParent':expected},sort_keys=True))
          PY
      - name: Preserve limited-duration metadata-only review
        uses: actions/upload-artifact@v4
        with:
          name: rrgh-wave020-review-only
          path: backend/config/gorge-campaign-wave-020-20261031/
          retention-days: 1
          if-no-files-found: error
# Wave020 controlled expansion to512, current explicit campaign maximum, after Wave019 independent full verification. Exact Wave019 receipt,2913 accepted,45 excluded; 2000 Class-A producer cap,120s token refresh and no retries/concurrency changes.
# Offline planning only. Temporary contents:write must be retired after plan commit. No GCS credentials, source images, map production or public deployment.