name: Generate continuous raster sunlight smoothing test

on:
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - scripts/generate-rrg-lidar-sun-raster-test.py
      - .github/workflows/generate-rrg-lidar-sun-raster-test.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rrg-lidar-sun-raster-test
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: staging/routes-tracks-interactive-map

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install terrain-only generator dependencies
        run: pip install numpy==2.3.5 scipy==1.17.0 rasterio==1.5.1 pyproj==3.8.0 shapely==2.1.2 requests==2.34.2 pillow==11.3.0

      - name: Fingerprint accepted sunlight layer before test generation
        shell: bash
        run: |
          sha256sum public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/*.geojson | sort > /tmp/accepted-sun-before.sha256

      - name: Generate continuous raster smoothing test
        run: python scripts/generate-rrg-lidar-sun-raster-test.py

      - name: Prove accepted sunlight layer is untouched
        shell: bash
        run: |
          sha256sum public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/*.geojson | sort > /tmp/accepted-sun-after.sha256
          diff -u /tmp/accepted-sun-before.sha256 /tmp/accepted-sun-after.sha256
          test -z "$(git status --porcelain -- public/data/map/rrg-lidar-sun-manifest.json public/data/map/rrg-lidar-sun/)"

      - name: Commit raster-test outputs only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/map/rrg-lidar-sun-raster-test-manifest.json public/data/map/rrg-lidar-sun-raster-test/
          if git diff --cached --quiet; then
            echo "Continuous raster sunlight test already current."
          else
            git commit -m "Generate continuous raster sunlight smoothing test overlay"
            git push
          fi
