name: Materialize header logo V3

on:
  push:
    branches:
      - uat/gear-four-products-20260828
    paths:
      - .github/workflows/materialize-header-logo-v3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out UAT branch
        uses: actions/checkout@v4
        with:
          ref: uat/gear-four-products-20260828
          fetch-depth: 0

      - name: Download exact approved V3 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/brand
          curl -fL 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-8d9c-81f5-b04e-c767a4aa3828/raw?se=2026-08-29T14%3A27%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=9a5e61ff-0c96-4cc8-ab30-15b893e136d4&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A52%3A07Z&ske=2026-08-29T20%3A52%3A07Z&sks=b&skv=2026-02-06&sig=VSd2b43cXsTBWZqIgx/HUn849xraiOzwvMIxj2H1224%3D' -o public/assets/brand/rrgh-banner-logo-profile-transparent-v3.webp
          curl -fL 'https://oaisdmntprcentralus.blob.core.windows.net/files/00000000-a9f8-81f5-a758-8547420d7cec/raw?se=2026-08-29T14%3A27%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=9a5e61ff-0c96-4cc8-ab30-15b893e136d4&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T20%3A52%3A10Z&ske=2026-08-29T20%3A52%3A10Z&sks=b&skv=2026-02-06&sig=JfTsEalkmaVlqDP0feP3FozgsVZ%2BWw85XT9XkfcBr/U%3D' -o public/assets/brand/rrgh-banner-logo-profile-transparent-v3.avif

      - name: Verify exact source hashes
        shell: bash
        run: |
          set -euo pipefail
          echo '723188929fd868e3c6e6c82a966769c398fc07044231b65c5a0ff8c5fbed9aaf  public/assets/brand/rrgh-banner-logo-profile-transparent-v3.webp' | sha256sum -c -
          echo '5a4ca76f10f6462abecf8e33ac00c8e2b6ad8f18b3e7289a9ec3d31284da1578  public/assets/brand/rrgh-banner-logo-profile-transparent-v3.avif' | sha256sum -c -

      - name: Commit assets and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add public/assets/brand/rrgh-banner-logo-profile-transparent-v3.webp public/assets/brand/rrgh-banner-logo-profile-transparent-v3.avif
          git rm .github/workflows/materialize-header-logo-v3.yml
          git commit -m 'Add approved V3 header logo web assets'
          git push origin HEAD:uat/gear-four-products-20260828
