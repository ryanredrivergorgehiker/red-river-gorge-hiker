name: RRGH log read and in-run handoff offline QA
on:
  push:
    branches: [lane20/log-read-inrun-handoff-20261104]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5a84c6d9d2fd80a78b45acb28154924393839116
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Conditional write, dispatch, ownership and recovered receipt regressions
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_state_reconciliation.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_pre_admission.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_active_run_inventory.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_log_reads.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_dispatcher.py -v
      - name: Exact current source to fresh successors with no credentials or Cloud writes
        run: python .github/automation/verify_rrgh_dispatch_roundtrip.py source-checkout
