name: RRGH hourly map production status
on:
  push:
    branches: [main]
    paths: [.github/workflows/rrgh-map-hourly-status.yml, .github/automation/rrgh_map_status.py]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: rrgh-hourly-map-status-only
  cancel-in-progress: true
jobs:
  inspect:
    if: github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current-controller status rules
        run: python3 -m unittest discover -s .github/automation -p test_rrgh_map_status.py
      - name: Report the exact current controller and independently verified inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/automation/rrgh_map_status.py
