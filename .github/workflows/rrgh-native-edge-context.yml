name: RRGH native edge context mask proof
on:
  push:
    branches: [lane20/native-edge-context-20261110]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GDAL_NUM_THREADS: '1'
jobs:
  edge-context:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 895c01953481b2b5825abee9a4c0681f37211eb4
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Test genuine neighboring rasters against the same full edge windows
        run: timeout 2450 python .github/automation/rrgh_native_edge_context.py source-checkout
