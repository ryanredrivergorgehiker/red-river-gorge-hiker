name: Cleanup final LLC verification artifacts

on:
  push:
    branches:
      - uat/llc-website-transition-20260822

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: uat/llc-website-transition-20260822
          fetch-depth: 0
      - name: Remove generated verification artifacts and helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r tests/__pycache__
          git rm .github/workflows/cleanup-final-llc-pycache.yml
          git commit -m 'Remove generated LLC verification artifacts'
          git push origin HEAD:uat/llc-website-transition-20260822
