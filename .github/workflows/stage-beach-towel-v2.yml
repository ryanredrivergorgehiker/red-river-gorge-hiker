# rerun after verified chunk-06 correction
name: Stage Beach Towel V2 image correction

on:
  push:
    branches:
      - fix/beach-towel-v2
    paths:
      - .github/workflows/stage-beach-towel-v2.yml

permissions:
  contents: write

jobs:
  build-beach-towel-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/beach-towel-v2
          fetch-depth: 0

      - name: Reconstruct and verify approved V2 Gear AVIF
        run: |
          set -euo pipefail
          mkdir -p public/assets/merchandise
          cat .beach-towel-v2/chunk-*.b64 | base64 --decode > public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif
          echo '1348ef085542cc0875ba9989837230b55d85925076ad33fcfd58c7453049d8a3  public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif' | sha256sum --check --strict
          test "$(stat -c %s public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif)" = '82842'

      - name: Generate and verify matching social-preview JPEG
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          avif='public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif'
          jpg='public/assets/merchandise/rrgh-merch-towel-beach-1348ef08-share.jpg'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$avif")" = '657x1000'
          ffmpeg -hide_banner -loglevel error -y -i "$avif" -frames:v 1 -q:v 2 "$jpg"
          test -s "$jpg"
          file "$jpg" | grep -q 'JPEG image data'
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$jpg")" = '657x1000'

      - name: Update only Beach Towel image reference and dimensions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/data/merchandise.ts')
          original = path.read_text(encoding='utf-8')
          old_name = 'rrgh-merch-towel-beach-35a77bd5.avif'
          new_name = 'rrgh-merch-towel-beach-1348ef08.avif'
          start_marker = "  {\n    slug: 'beach-towel',"
          next_marker = "  {\n    slug: 'kids-tshirt',"

          if original.count(old_name) != 1:
              raise RuntimeError(f'Expected one active old Beach Towel image reference; found {original.count(old_name)}')
          if new_name in original:
              raise RuntimeError('New Beach Towel reference unexpectedly already exists')

          start = original.index(start_marker)
          end = original.index(next_marker, start)
          before = original[:start]
          block = original[start:end]
          after = original[end:]

          required = [
              "title: 'Beach Towel'",
              "description: 'A 32 × 64-inch green beach towel featuring the Red River Gorge Hiker logo.'",
              "priceLabel: '$32.50'",
              "specification: '32 × 64 inches'",
              "fineArtAmericaUrl: 'https://fineartamerica.com/featured/red-river-gorge-hiker-ryan-d-lewis.html?product=beach-towel'",
              "alt: 'Green Red River Gorge Hiker logo beach towel spread on sand beside the ocean.'",
              'width: 800,',
              'height: 1000,'
          ]
          for value in required:
              if value not in block:
                  raise RuntimeError(f'Beach Towel immutable contract missing before edit: {value}')
          if block.count('width: 800,') != 1:
              raise RuntimeError('Expected exactly one Beach Towel width field')

          updated_block = block.replace(old_name, new_name, 1).replace('width: 800,', 'width: 657,', 1)
          updated = before + updated_block + after

          normalized = updated.replace(new_name, old_name, 1)
          nstart = normalized.index(start_marker)
          nend = normalized.index(next_marker, nstart)
          nblock = normalized[nstart:nend].replace('width: 657,', 'width: 800,', 1)
          normalized = normalized[:nstart] + nblock + normalized[nend:]
          if normalized != original:
              raise RuntimeError('Unexpected merchandise data change outside the authorized Beach Towel image swap')

          path.write_text(updated, encoding='utf-8')
          PY

      - name: Add Beach Towel V2 repository contract
        run: |
          set -euo pipefail
          cat > tests/test_beach_towel_v2_contract.py <<'PY'
          import hashlib
          import re
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          MERCH = (ROOT / 'src/data/merchandise.ts').read_text(encoding='utf-8')


          class BeachTowelV2ContractTests(unittest.TestCase):
              def test_beach_towel_product_data_is_preserved_and_v2_is_active(self):
                  match = re.search(r"\{\n\s+slug: 'beach-towel',(?P<body>.*?)\n\s+\},\n\s+\{\n\s+slug: 'kids-tshirt'", MERCH, re.S)
                  self.assertIsNotNone(match)
                  body = match.group('body')
                  self.assertIn("title: 'Beach Towel'", body)
                  self.assertIn("description: 'A 32 × 64-inch green beach towel featuring the Red River Gorge Hiker logo.'", body)
                  self.assertIn("priceLabel: '$32.50'", body)
                  self.assertIn("specification: '32 × 64 inches'", body)
                  self.assertIn("fineArtAmericaUrl: 'https://fineartamerica.com/featured/red-river-gorge-hiker-ryan-d-lewis.html?product=beach-towel'", body)
                  self.assertIn('rrgh-merch-towel-beach-1348ef08.avif', body)
                  self.assertIn('width: 657', body)
                  self.assertIn('height: 1000', body)
                  self.assertIn("alt: 'Green Red River Gorge Hiker logo beach towel spread on sand beside the ocean.'", body)
                  self.assertNotIn('rrgh-merch-towel-beach-35a77bd5.avif', MERCH)

              def test_beach_towel_v2_derivatives_exist_and_hash_contract_holds(self):
                  avif = ROOT / 'public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif'
                  jpg = ROOT / 'public/assets/merchandise/rrgh-merch-towel-beach-1348ef08-share.jpg'
                  self.assertTrue(avif.is_file())
                  self.assertTrue(jpg.is_file())
                  self.assertEqual(hashlib.sha256(avif.read_bytes()).hexdigest(), '1348ef085542cc0875ba9989837230b55d85925076ad33fcfd58c7453049d8a3')

              def test_prior_public_derivatives_are_preserved_but_not_active(self):
                  self.assertTrue((ROOT / 'public/assets/merchandise/rrgh-merch-towel-beach-35a77bd5.avif').is_file())
                  self.assertTrue((ROOT / 'public/assets/merchandise/rrgh-merch-towel-beach-35a77bd5-share.jpg').is_file())
                  self.assertNotIn('rrgh-merch-towel-beach-35a77bd5.avif', MERCH)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Run full website checks
        run: |
          set -euo pipefail
          npm ci
          npm run check
          git diff --check

      - name: Verify no unintended tracked-file modifications
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          allowed = {
              'src/data/merchandise.ts',
              'tests/test_beach_towel_v2_contract.py',
              'public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif',
              'public/assets/merchandise/rrgh-merch-towel-beach-1348ef08-share.jpg',
          }
          changed = set(subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines())
          paths = set()
          for line in changed:
              path = line[3:]
              if path.startswith('.beach-towel-v2/') or path == '.github/workflows/stage-beach-towel-v2.yml':
                  continue
              paths.add(path)
          unexpected = paths - allowed
          if unexpected:
              raise RuntimeError(f'Unexpected working-tree changes: {sorted(unexpected)}')
          PY

      - name: Commit tested candidate and remove temporary transfer tooling
        run: |
          set -euo pipefail
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add src/data/merchandise.ts tests/test_beach_towel_v2_contract.py \
            public/assets/merchandise/rrgh-merch-towel-beach-1348ef08.avif \
            public/assets/merchandise/rrgh-merch-towel-beach-1348ef08-share.jpg
          git rm -r .beach-towel-v2 .github/workflows/stage-beach-towel-v2.yml
          git diff --cached --check
          git commit -m 'Use approved Beach Towel V2 image'
          git push origin HEAD:fix/beach-towel-v2
