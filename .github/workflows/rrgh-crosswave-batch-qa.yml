name: RRGH bounded overview batch QA
on:
  push:
    branches: [lane20/crosswave-scaled-completion-20261109]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: renderer-source
jobs:
  batch-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2c121dfba317d918749acaadd6842be81c88fee1
          path: renderer-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2a0e8a2a99d7fe3979dc7e2e65c4979667112728
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Original renderer, bounded dependency reads, independent proof and corruption gates
        run: python -m unittest discover -s .github/automation -p 'test_rrgh_crosswave*.py' -v
      - name: Actual verified1357 to consecutive nonoverlapping bounded batches
        run: python .github/automation/verify_rrgh_crosswave_batch_roundtrip.py source-checkout
      - name: Preserve handoff, publication and existing recovery paths
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_published_successor.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_completion_throughput.py -v
