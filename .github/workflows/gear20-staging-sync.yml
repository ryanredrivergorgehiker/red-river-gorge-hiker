name: Gear 20 staging sync

on:
  push:
    branches:
      - feature/sar-camping-guide-staging
    paths:
      - .github/workflows/gear20-staging-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: feature/sar-camping-guide-staging
          fetch-depth: 0

      - name: Apply controlled 20-card Gear update
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/gear20-assets.tar.gz.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/gear20-assets.tar.gz.b64 > /tmp/gear20-assets.tar.gz
          mkdir -p public/assets/merchandise
          tar -xzf /tmp/gear20-assets.tar.gz -C public/assets/merchandise
          rm -f \
            public/assets/merchandise/rrgh-merch-coffee-mug-0d15378a.avif \
            public/assets/merchandise/rrgh-merch-greeting-card-415e37be.avif \
            public/assets/merchandise/rrgh-merch-tshirt-chest-70ec579b.avif \
            public/assets/merchandise/rrgh-merch-tshirt-pocket-305a009a.avif

