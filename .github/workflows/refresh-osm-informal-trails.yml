name: Refresh OSM informal trails cache

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - 'scripts/update_osm_informal_trails.py'
      - '.github/workflows/refresh-osm-informal-trails.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial cache dependencies
        run: python -m pip install --disable-pip-version-check shapely pyproj
      - name: Refresh cached OpenStreetMap informal trails
        run: python scripts/update_osm_informal_trails.py
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/map/osm-informal-trails.geojson
          if git diff --cached --quiet; then
            echo "OSM cache unchanged."
          else
            git commit -m "Refresh cached OSM informal trails [skip ci]"
            git push
          fi
