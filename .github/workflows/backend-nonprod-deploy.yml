name: Backend Nonproduction Deploy

on:
  push:
    branches:
      - backend/phase-3-nonprod
    paths:
      - "backend/**"
      - ".github/workflows/backend-nonprod-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: rrgh-backend-nonproduction
  cancel-in-progress: false

env:
  PROJECT_ID: rrgh-nonproduction
  PROJECT_NUMBER: "843975209563"
  FUNCTION_REGION: us-east5
  FUNCTION_NAME: rrghAccountApi
  PACKAGE_DOWNLOAD_FUNCTION_NAME: rrghPackageDownload
  RRGH_PACKAGE_BUCKET: rrgh-nonproduction-protected-packages
  RRGH_DEPLOY_SERVICE_ACCOUNT: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
  GORGE_BASE_VERSION: "2026.10.08.1"

jobs:
  deploy-and-verify:
    # A one-time READ-ONLY audit merge must never redeploy any backend functions,
    # rebuild Gorge Base, upload packages or mutate a Firestore catalog.
    if: ${{ !(github.event_name == 'push' && (startsWith(github.event.head_commit.message, '[regional-readonly-verification]') || startsWith(github.event.head_commit.message, '[regional-inactive-stage]') || startsWith(github.event.head_commit.message, '[regional-functions-deploy]') || startsWith(github.event.head_commit.message, '[regional-nonprod-activate]'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify nonproduction delivery guardrails
        run: node backend/scripts/phase3-readiness.mjs

      - name: Install backend dependencies
        run: npm install --prefix backend/functions --no-audit --no-fund

      - name: Run emulator contract
        working-directory: backend
        run: >
          npx --yes firebase-tools@15.30.2 emulators:exec
          --project demo-rrgh-entitlements
          --only auth,firestore,functions,storage
          "npm --prefix functions test"

      - name: Authenticate to Google Cloud without a service-account key
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform,https://www.googleapis.com/auth/drive.readonly

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction

      - name: Verify federated identity and Drive source access prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project)" = "rrgh-nonproduction"
          gcloud auth list --filter=status:ACTIVE --format='value(account)'

          if ! gcloud services list \
            --enabled \
            --project="$PROJECT_ID" \
            --filter='config.name:drive.googleapis.com' \
            --format='value(config.name)' \
            | grep -Fx 'drive.googleapis.com'; then
            echo "Drive API is not yet enabled; enabling it for the nonproduction governed-source staging path."
            gcloud services enable drive.googleapis.com --project="$PROJECT_ID"
          fi

          gcloud services list \
            --enabled \
            --project="$PROJECT_ID" \
            --filter='config.name:drive.googleapis.com' \
            --format='value(config.name)' \
            | grep -Fx 'drive.googleapis.com'

      - name: Install offline package build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin osmium-tool unzip

      - name: Stage exact governed route package bytes from private Drive
        shell: bash
        run: |
          set -euo pipefail
          ROUTE_DIR="$RUNNER_TEMP/rrgh-route-packages"
          echo "RRGH_ROUTE_PACKAGE_DIR=$ROUTE_DIR" >> "$GITHUB_ENV"
          export GOOGLE_OAUTH_ACCESS_TOKEN="${{ steps.google-auth.outputs.access_token }}"
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"
          bash backend/scripts/stage-governed-route-packages.sh "$ROUTE_DIR"

      - name: Create or harden private nonproduction package bucket
        shell: bash
        run: |
          set -euo pipefail
          BUCKET_URI="gs://$RRGH_PACKAGE_BUCKET"

          if ! gcloud storage buckets describe "$BUCKET_URI"             --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "$BUCKET_URI"               --project="$PROJECT_ID"               --location="$FUNCTION_REGION"               --uniform-bucket-level-access               --public-access-prevention
          fi

          gcloud storage buckets update "$BUCKET_URI"             --uniform-bucket-level-access             --public-access-prevention

          POLICY="$(gcloud storage buckets get-iam-policy "$BUCKET_URI" --format=json)"
          if printf '%s' "$POLICY" | jq -e '
            [.bindings[]?.members[]?]
            | any(. == "allUsers" or . == "allAuthenticatedUsers")
          ' >/dev/null; then
            echo "::error::Protected package bucket has a public IAM member."
            exit 1
          fi

      - name: Ensure private offline lease signing keyring
        shell: bash
        run: |
          set -euo pipefail
          KEY_OBJECT="gs://$RRGH_PACKAGE_BUCKET/backend-secrets/offline-lease/keyring-v1.json"
          KEY_FILE="$RUNNER_TEMP/rrgh-offline-lease-keyring-v1.json"

          if gcloud storage objects describe "$KEY_OBJECT" >/dev/null 2>&1; then
            gsutil cp "$KEY_OBJECT" "$KEY_FILE"
            node backend/scripts/ensure-offline-lease-keyring.mjs "$KEY_FILE"
            echo "Reusing existing private offline lease keyring."
          else
            node backend/scripts/ensure-offline-lease-keyring.mjs "$KEY_FILE"
            gsutil -h "Content-Type:application/json" \
              -h "x-goog-meta-rrgh-purpose:offline-entitlement-lease-signing" \
              cp -n "$KEY_FILE" "$KEY_OBJECT"
            echo "Created private offline lease keyring in the existing protected bucket."
          fi

          rm -f "$KEY_FILE"
          gcloud storage objects describe "$KEY_OBJECT" \
            --format='json(name,size,contentType,metadata)'

      - name: Build immutable Gorge Base package when version is absent
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/rrgh-gorge-base"
          BASE_PACKAGE="$BASE_DIR/gorge-base-$GORGE_BASE_VERSION.rrghpkg"
          BASE_MANIFEST="$BASE_DIR/gorge-base-manifest.json"
          BASE_OBJECT="gs://$RRGH_PACKAGE_BUCKET/packages/offline/gorge-base/$GORGE_BASE_VERSION/gorge-base.rrghpkg"
          MANIFEST_OBJECT="gs://$RRGH_PACKAGE_BUCKET/packages/offline/gorge-base/$GORGE_BASE_VERSION/manifest.json"

          echo "RRGH_BASE_PACKAGE_PATH=$BASE_PACKAGE" >> "$GITHUB_ENV"
          echo "RRGH_BASE_MANIFEST_PATH=$BASE_MANIFEST" >> "$GITHUB_ENV"

          if gcloud storage objects describe "$BASE_OBJECT" >/dev/null 2>&1; then
            mkdir -p "$BASE_DIR"
            gsutil cp "$BASE_OBJECT" "$BASE_PACKAGE"
            gsutil cp "$MANIFEST_OBJECT" "$BASE_MANIFEST"
            echo "Reusing immutable Gorge Base $GORGE_BASE_VERSION from private bucket."
          else
            bash backend/scripts/build-gorge-base.sh "$BASE_DIR" "$GORGE_BASE_VERSION"

            BASE_SHA="$(jq -r '.sha256' "$BASE_MANIFEST")"
            BASE_BYTES="$(jq -r '.byteCount' "$BASE_MANIFEST")"
            test "$(sha256sum "$BASE_PACKAGE" | awk '{print $1}')" = "$BASE_SHA"
            test "$(stat -c '%s' "$BASE_PACKAGE")" = "$BASE_BYTES"

            gsutil -h "Content-Type:application/octet-stream"               -h "x-goog-meta-rrgh-sha256:$BASE_SHA"               -h "x-goog-meta-rrgh-package-id:gorge-base"               -h "x-goog-meta-rrgh-version:$GORGE_BASE_VERSION"               cp -n "$BASE_PACKAGE" "$BASE_OBJECT"

            gsutil -h "Content-Type:application/json"               cp -n "$BASE_MANIFEST" "$MANIFEST_OBJECT"
          fi

      - name: Upload immutable governed route package objects
        shell: bash
        run: |
          set -euo pipefail

          upload_route() {
            local package_id="$1"
            local version="$2"
            local filename="$3"
            local expected_sha="$4"
            local expected_bytes="$5"
            local object="gs://$RRGH_PACKAGE_BUCKET/packages/routes/$package_id/$version/route.geojson"

            test "$(sha256sum "$filename" | awk '{print $1}')" = "$expected_sha"
            test "$(stat -c '%s' "$filename")" = "$expected_bytes"

            if ! gcloud storage objects describe "$object" >/dev/null 2>&1; then
              gsutil -h "Content-Type:application/geo+json"                 -h "x-goog-meta-rrgh-sha256:$expected_sha"                 -h "x-goog-meta-rrgh-package-id:$package_id"                 -h "x-goog-meta-rrgh-version:$version"                 cp -n "$filename" "$object"
            fi
          }

          upload_route             "route-rte-0001"             "1"             "$RRGH_ROUTE_PACKAGE_DIR/route-rte-0001.geojson"             "123fdb57e1142299f86c714367cc466b70f18fa90cfbaabb92b0d9ced157dc66"             "8201"

          upload_route             "route-rte-0002"             "1"             "$RRGH_ROUTE_PACKAGE_DIR/route-rte-0002.geojson"             "ced314bb34392750b0f823c9a11bc95a48e6fa52c59830d4ee83619f615d6602"             "6533"

      - name: Deploy deny-all Firestore rules and protected-delivery Functions
        working-directory: backend
        run: >
          npx --yes firebase-tools@15.30.2 deploy
          --project rrgh-nonproduction
          --only firestore:rules,functions:rrgh-account:rrghAccountApi,functions:rrgh-account:rrghPackageDownload
          --non-interactive

      - name: Grant deployed runtime read-only access to private package objects
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SA="$(gcloud functions describe rrghAccountApi             --gen2             --region="$FUNCTION_REGION"             --project="$PROJECT_ID"             --format='value(serviceConfig.serviceAccountEmail)')"
          test -n "$RUNTIME_SA"
          echo "RRGH_RUNTIME_SERVICE_ACCOUNT=$RUNTIME_SA" >> "$GITHUB_ENV"

          gcloud storage buckets add-iam-policy-binding             "gs://$RRGH_PACKAGE_BUCKET"             --member="serviceAccount:$RUNTIME_SA"             --role="roles/storage.objectViewer"             --quiet

          # LEG-DEC-0035 signing uses a private RSA keyring stored under
          # backend-secrets/ in this same private bucket. The runtime receives
          # read-only object access only; clients remain denied and no public
          # or permanent download URL is created. No KMS/new paid service is used.
          # Large packages remain bounded authenticated byte ranges through
          # rrghPackageDownload.

      - name: Seed exact package catalog metadata
        run: node backend/scripts/seed-package-catalog.mjs
        env:
          RRGH_PACKAGE_BUCKET: ${{ env.RRGH_PACKAGE_BUCKET }}
          RRGH_ROUTE_PACKAGE_DIR: ${{ env.RRGH_ROUTE_PACKAGE_DIR }}
          RRGH_BASE_PACKAGE_PATH: ${{ env.RRGH_BASE_PACKAGE_PATH }}
          RRGH_BASE_MANIFEST_PATH: ${{ env.RRGH_BASE_MANIFEST_PATH }}

      - name: Verify deployed Function inventory
        working-directory: backend
        run: |
          npx --yes firebase-tools@15.30.2 functions:list --project rrgh-nonproduction
          gcloud functions describe rrghAccountApi             --gen2             --region="$FUNCTION_REGION"             --project="$PROJECT_ID"             --format='table(name,state,serviceConfig.availableMemory,buildConfig.runtime,serviceConfig.serviceAccountEmail)'
          gcloud functions describe rrghPackageDownload             --gen2             --region="$FUNCTION_REGION"             --project="$PROJECT_ID"             --format='table(name,state,serviceConfig.availableMemory,buildConfig.runtime,serviceConfig.serviceAccountEmail)'

      - name: Verify private object metadata and no public object path
        shell: bash
        run: |
          set -euo pipefail
          for object in             "packages/routes/route-rte-0001/1/route.geojson"             "packages/routes/route-rte-0002/1/route.geojson"             "packages/offline/gorge-base/$GORGE_BASE_VERSION/gorge-base.rrghpkg"; do
            gcloud storage objects describe               "gs://$RRGH_PACKAGE_BUCKET/$object"               --format='json(name,size,contentType,metadata)'
            code="$(curl -sS -o /dev/null -w '%{http_code}'               "https://storage.googleapis.com/$RRGH_PACKAGE_BUCKET/$object")"
            if [ "$code" = "200" ]; then
              echo "::error::Protected package object is publicly readable: $object"
              exit 1
            fi
          done

      - name: Resolve live endpoint and Firebase API key
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_URL="$(gcloud functions describe rrghAccountApi             --gen2             --region="$FUNCTION_REGION"             --project="$PROJECT_ID"             --format='value(serviceConfig.uri)')"
          PACKAGE_DOWNLOAD_URL="$(gcloud functions describe rrghPackageDownload             --gen2             --region="$FUNCTION_REGION"             --project="$PROJECT_ID"             --format='value(serviceConfig.uri)')"
          test -n "$FUNCTION_URL"
          test -n "$PACKAGE_DOWNLOAD_URL"
          echo "RRGH_FUNCTION_URL=$FUNCTION_URL" >> "$GITHUB_ENV"
          echo "RRGH_PACKAGE_DOWNLOAD_SERVICE_URL=$PACKAGE_DOWNLOAD_URL" >> "$GITHUB_ENV"

          FIREBASE_IOS_APP_ID="1:843975209563:ios:68d59290136388c8f0857e"
          npx --yes firebase-tools@15.30.2 apps:sdkconfig \
            ios "$FIREBASE_IOS_APP_ID" \
            --project "$PROJECT_ID" \
            --non-interactive \
            > /tmp/rrgh-ios-GoogleService-Info.plist

          API_KEY="$(python3 -c 'import plistlib; p=plistlib.load(open("/tmp/rrgh-ios-GoogleService-Info.plist","rb")); assert p["BUNDLE_ID"]=="com.redrivergorgehiker.ios"; assert p["PROJECT_ID"]=="rrgh-nonproduction"; assert p["GOOGLE_APP_ID"]=="1:843975209563:ios:68d59290136388c8f0857e"; print(p["API_KEY"], end="")')"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"
          echo "FIREBASE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          rm -f /tmp/rrgh-ios-GoogleService-Info.plist

      - name: Run remote authenticated, integrity, expiry, and security smoke tests
        run: node backend/scripts/nonprod-remote-smoke.mjs

      - name: Publish deploy result as commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            STATE="success"
            DESCRIPTION="RRGH backend nonproduction deploy verified"
          else
            STATE="failure"
            DESCRIPTION="RRGH backend nonproduction deploy failed"
          fi

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" \
            -f context="rrgh/backend-nonprod-deploy" \
            -f description="$DESCRIPTION"

  regional-core-readonly-verification:
    # Reuse the EXACT pre-existing trusted nonproduction workflow and WIF
    # identity. This is NOT the rejected standalone production-provider workflow.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/backend/phase-3-nonprod' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, '[regional-readonly-verification]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout pinned original protected controller (NO producer)
        uses: actions/checkout@v4
        with:
          ref: 274364a5b0b67000dcdd45b03b777c96d6cb315a
          path: protected-controller
          persist-credentials: false

      - name: Checkout exact previously tested PR148 verification helper (NO writes)
        uses: actions/checkout@v4
        with:
          ref: 711834b8eae2b7aeba7253a80ebae247996082d8
          path: verifier-source
          persist-credentials: false

      - name: Verify immutable source identities and source-only negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protected-controller hash-object .github/automation/rrgh-controller-state.json)" = "04bd859c55d981cbacdc259ea59ba8d4ae12e459"
          test "$(git -C verifier-source rev-parse HEAD)" = "711834b8eae2b7aeba7253a80ebae247996082d8"
          python3 -m py_compile verifier-source/backend/scripts/verify_remote_regional_candidate_readonly_20261118.py
          cd verifier-source
          python3 -m unittest discover -s backend/scripts -p 'test_verify_remote_regional_candidate_readonly_20261118.py' -v
          cd ..

      - name: Authenticate via existing restricted nonproduction GitHub identity
        id: audited-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/devstorage.read_only

      - name: Independently attest 3 immutable record bodies and 125 original metadata objects
        shell: bash
        env:
          RRGH_GCS_READONLY_TOKEN: ${{ steps.audited-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$RRGH_GCS_READONLY_TOKEN"
          python3 verifier-source/backend/scripts/verify_remote_regional_candidate_readonly_20261118.py \
            --controller protected-controller/.github/automation/rrgh-controller-state.json

      - name: Preserve read-only audit outcome without credentials or object names
        if: always()
        shell: bash
        run: |
          echo "AUDIT_FINISHED_NO_GCS_WRITES_NO_FIRESTORE_WRITES_NO_ARCHIVES_FETCHED"

  regional-core-inactive-stage:
    # Already-authorized INACTIVE nonproduction stage. Strictly separate from
    # public/customer activation, producer and existing backend deployments.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/backend/phase-3-nonprod' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, '[regional-inactive-stage]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout fixed protected controller without production dispatch
        uses: actions/checkout@v4
        with:
          ref: 274364a5b0b67000dcdd45b03b777c96d6cb315a
          path: protected-controller
          persist-credentials: false

      - name: Checkout exact independently tested private candidate stage source
        uses: actions/checkout@v4
        with:
          ref: 223a0579529732c70fc56753f4638ed95e02d7a7
          path: verifier-source
          persist-credentials: false

      - name: Enforce unchanged source, catalog authority and no-write unit tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protected-controller hash-object .github/automation/rrgh-controller-state.json)" = "04bd859c55d981cbacdc259ea59ba8d4ae12e459"
          test "$(git -C verifier-source rev-parse HEAD)" = "223a0579529732c70fc56753f4638ed95e02d7a7"
          cd verifier-source
          python3 -m unittest discover -s backend/scripts -p 'test_verify_remote_regional_candidate_readonly_20261118.py' -q
          python3 -m unittest discover -s backend/scripts -p 'test_insert_inactive_regional_catalog_nonprod_20261118.py' -q
          cd ..

      - name: Authenticate as existing nonproduction deploy identity (no new IAM)
        id: stage-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Reverify full immutable 131-read source and construct LOCAL PRIVATE inactive plan
        shell: bash
        env:
          RRGH_GCS_READONLY_TOKEN: ${{ steps.stage-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$RRGH_GCS_READONLY_TOKEN"
          umask 077
          python3 verifier-source/backend/scripts/verify_remote_regional_candidate_readonly_20261118.py \
            --controller protected-controller/.github/automation/rrgh-controller-state.json \
            --private-staging-output "$RUNNER_TEMP/rrgh-regional-inactive-plan.json"
          test -f "$RUNNER_TEMP/rrgh-regional-inactive-plan.json"

      - name: Atomically INSERT 125 INACTIVE private nonproduction Firestore docs only
        shell: bash
        env:
          RRGH_GOOGLE_ACCESS_TOKEN: ${{ steps.stage-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "$RRGH_GOOGLE_ACCESS_TOKEN"
          python3 verifier-source/backend/scripts/insert_inactive_regional_catalog_nonprod_20261118.py \
            --private-stage-plan "$RUNNER_TEMP/rrgh-regional-inactive-plan.json"

      - name: Delete private local candidate path listing even after failure
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/rrgh-regional-inactive-plan.json"

  regional-core-functions-deploy:
    # Upgrade ONLY two existing nonproduction Functions to generation-pinned
    # regional object reads. No map generation, bucket/object writes, catalog
    # mutations, Firestore rule changes, IAM changes or public activation.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/backend/phase-3-nonprod' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, '[regional-functions-deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recheck exact generation-pinned code and baseline guardrails
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/functions/src/delivery.js
          node --check backend/functions/src/index.js
          node backend/scripts/phase3-readiness.mjs
      - name: Install existing Functions dependencies without other build steps
        run: npm install --prefix backend/functions --no-audit --no-fund
      - name: Re-execute existing Firebase emulator security and contract suite
        working-directory: backend
        run: >
          npx --yes firebase-tools@15.30.2 emulators:exec
          --project demo-rrgh-entitlements
          --only auth,firestore,functions,storage
          "npm --prefix functions test"
      - name: Authenticate using established nonproduction WIF service account
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Update existing rrghAccountApi and rrghPackageDownload ONLY
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.30.2 deploy \
            --project rrgh-nonproduction \
            --only functions:rrgh-account:rrghAccountApi,functions:rrgh-account:rrghPackageDownload \
            --non-interactive
      - name: Verify both existing nonproduction functions are ACTIVE
        shell: bash
        run: |
          set -euo pipefail
          for f in rrghAccountApi rrghPackageDownload; do
            state="$(gcloud functions describe "$f" --gen2 --region=us-east5 --project=rrgh-nonproduction --format='value(state)')"
            test "$state" = "ACTIVE"
            echo "FUNCTION_DEPLOYED_ACTIVE=$f"
          done


  regional-core-nonprod-activate-and-smoke:
    # Authenticated readback, exact staged-document activation and bounded live
    # smoke under existing nonproduction WIF identity. No producer/deploy job.
    if: >-
      github.event_name == 'push' &&
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/backend/phase-3-nonprod' &&
      github.run_attempt == 1 &&
      startsWith(github.event.head_commit.message, '[regional-nonprod-activate]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 274364a5b0b67000dcdd45b03b777c96d6cb315a
          path: protected-controller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2299e457008b9b74ba98308001586f1ff4978895
          path: verifier-source
          persist-credentials: false
      - name: Exact authority guard and source-only negative tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protected-controller hash-object .github/automation/rrgh-controller-state.json)" = "04bd859c55d981cbacdc259ea59ba8d4ae12e459"
          test "$(git -C verifier-source rev-parse HEAD)" = "2299e457008b9b74ba98308001586f1ff4978895"
          cd verifier-source
          for pattern in test_activate_regional_catalog_nonprod_20261118.py test_verify_remote_regional_candidate_readonly_20261118.py test_insert_inactive_regional_catalog_nonprod_20261118.py; do
            python3 -m unittest discover -s backend/scripts -p "$pattern" -q
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bounded native JavaScript smoke syntax check
        run: node --check backend/scripts/nonprod-regional-core-smoke.mjs
      - name: Existing exact nonproduction WIF identity
        id: regional-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
      - name: Fresh 131-read independent immutable object re-attestation
        shell: bash
        env:
          RRGH_GCS_READONLY_TOKEN: ${{ steps.regional-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          umask 077
          python3 verifier-source/backend/scripts/verify_remote_regional_candidate_readonly_20261118.py \
            --controller protected-controller/.github/automation/rrgh-controller-state.json \
            --private-staging-output "$RUNNER_TEMP/rrgh-activation-private.json"
          test "$(stat -c '%a' "$RUNNER_TEMP/rrgh-activation-private.json")" = 600
      - name: Atomic 125-document nonproduction-only activation and readback
        shell: bash
        env:
          RRGH_GOOGLE_ACCESS_TOKEN: ${{ steps.regional-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          python3 verifier-source/backend/scripts/activate_regional_catalog_nonprod_20261118.py \
            --private-stage-plan "$RUNNER_TEMP/rrgh-activation-private.json"
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Resolve existing Functions and exact Firebase test config
        shell: bash
        run: |
          set -euo pipefail
          for fn in rrghAccountApi rrghPackageDownload; do
            test "$(gcloud functions describe "$fn" --gen2 --region=us-east5 --project=rrgh-nonproduction --format='value(state)')" = ACTIVE
          done
          URL="$(gcloud functions describe rrghAccountApi --gen2 --region=us-east5 --project=rrgh-nonproduction --format='value(serviceConfig.uri)')"
          test -n "$URL"
          echo "RRGH_FUNCTION_URL=$URL" >> "$GITHUB_ENV"
          npx --yes firebase-tools@15.30.2 apps:sdkconfig ios \
            '1:843975209563:ios:68d59290136388c8f0857e' \
            --project rrgh-nonproduction --non-interactive > "$RUNNER_TEMP/rrgh-firebase-config.plist"
          API_KEY="$(python3 -c 'import plistlib,sys;p=plistlib.load(open(sys.argv[1],"rb"));assert p["BUNDLE_ID"]=="com.redrivergorgehiker.ios" and p["PROJECT_ID"]=="rrgh-nonproduction" and p["GOOGLE_APP_ID"]=="1:843975209563:ios:68d59290136388c8f0857e";print(p["API_KEY"],end="")' "$RUNNER_TEMP/rrgh-firebase-config.plist")"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"
          echo "FIREBASE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
      - name: Install existing Admin SDK dependencies without deployment
        run: npm install --prefix backend/functions --no-audit --no-fund --ignore-scripts
      - name: Verify REAL signed Base UID and 3 indexes + bounded original parts
        run: node backend/scripts/nonprod-regional-core-smoke.mjs
      - name: Failure safety rollback to private staged state (no object changes)
        if: failure()
        shell: bash
        env:
          RRGH_GOOGLE_ACCESS_TOKEN: ${{ steps.regional-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/rrgh-activation-private.json"
          if [ ! -f "$P" ] || [ -z "$RRGH_GOOGLE_ACCESS_TOKEN" ]; then
            echo "NO_AUTHENTICATED_PRIVATE_PLAN_TO_ROLL_BACK"
            exit 0
          fi
          export RRGH_PRIVATE_PLAN="$P"
          cd verifier-source/backend/scripts
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from activate_regional_catalog_nonprod_20261118 import fetch_all,build_transition,commit_once
          plan=json.loads(Path(os.environ["RRGH_PRIVATE_PLAN"]).read_text())
          token=os.environ["RRGH_GOOGLE_ACCESS_TOKEN"]
          try:
              fetch_all(plan,token,expected_active=False)
              print("NONPROD_CATALOG_ALREADY_STAGED")
          except Exception:
              locks=fetch_all(plan,token,expected_active=True)
              commit_once(build_transition(plan,locks,activate=False),token)
              fetch_all(plan,token,expected_active=False)
              print("NONPROD_CATALOG_ROLLED_BACK_TO_INACTIVE")
          PY
      - name: Delete transient confidential artifacts
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rrgh-activation-private.json"
          rm -f "$RUNNER_TEMP/rrgh-firebase-config.plist"
      - name: Publish actual regional authenticated delivery outcome
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          if [ "$JOB_RESULT" = success ]; then
            STATE=success
            DESCRIPTION="125 active and original indexes + archive ranges passed Base/UID smoke"
          else
            STATE=failure
            DESCRIPTION="Regional activation/probe failed; inspect readback and rollback"
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="rrgh/regional-core-nonprod-live" \
            -f description="$DESCRIPTION"
