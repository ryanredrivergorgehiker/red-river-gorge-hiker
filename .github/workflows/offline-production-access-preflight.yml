name: Offline production access preflight
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-production-access-preflight.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-offline-production-access-preflight-20261029
  cancel-in-progress: false
jobs:
  read-only-access:
    if: github.run_number == 1 && github.run_attempt == 1 && github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate existing nonproduction identity
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
      - name: Inspect existing bucket and accepted package metadata only
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          token=os.environ["ACCESS_TOKEN"]
          bucket="rrgh-nonproduction-protected-packages"
          def get(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token})
              with urllib.request.urlopen(req,timeout=25) as r:
                  data=r.read(200001)
                  if len(data)>200000: raise ValueError("Metadata response too large")
                  return json.loads(data)
          b=get("https://storage.googleapis.com/storage/v1/b/"+bucket+"?fields=name,location,storageClass,iamConfiguration")
          policy=get("https://storage.googleapis.com/storage/v1/b/"+bucket+"/iam")
          public=any(m in ("allUsers","allAuthenticatedUsers") for binding in policy.get("bindings",[]) for m in binding.get("members",[]))
          cfg=b.get("iamConfiguration",{})
          private=not public and cfg.get("uniformBucketLevelAccess",{}).get("enabled") and cfg.get("publicAccessPrevention")=="enforced"
          objects=[]
          for suffix in ("gorge-base.rrghpkg","manifest.json"):
              name="packages/offline/gorge-base/2026.10.08.1/"+suffix
              o=get("https://storage.googleapis.com/storage/v1/b/"+bucket+"/o/"+urllib.parse.quote(name,safe="")+"?fields=name,size,generation,crc32c,md5Hash,metadata")
              objects.append({k:o.get(k) for k in ("name","size","generation","crc32c","md5Hash","metadata")})
          result={"format":"rrgh-production-access-preflight-v1","bucketPrivate":bool(private),"location":b.get("location"),"storageClass":b.get("storageClass"),"objects":objects,"packageBytesTransferred":0,"gcsWrites":0,"deployments":0,"catalogWrites":0,"actionsArtifacts":0}
          print(json.dumps(result,sort_keys=True))
          if not private: raise SystemExit("Private bucket safeguards not established")
          PY
