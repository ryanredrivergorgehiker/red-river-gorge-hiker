name: RRGH expanded source native validation
on:
  push:
    branches: [lane20/expanded-source-production-20261102]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  bounded-native-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 444fa31cab3e321bc6e93b32b315efaba1ed24cd
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Apply exact prospective native metadata validation in isolated checkout
        run: cp .github/automation/source-templates/benchmark_gorge_pipeline.py source-checkout/backend/scripts/benchmark_gorge_pipeline.py
      - name: Validate full native Hiking, Terrain halo and leaf-off windows under original resource caps
        run: >-
          python .github/automation/rrgh_validate_expanded_windows.py
          --source source-checkout
          --catalog backend/config/official-source-intake-20261102/official-source-candidates.json
          --spec .github/automation/rrgh-geographic-requirement-v1.json
          --output "${{ runner.temp }}/expanded-native-evidence.json"
