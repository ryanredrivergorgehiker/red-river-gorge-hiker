name: RRGH autonomous controller offline QA
on:
  push:
    branches: [lane20/autonomous-dispatch-20261102, lane20/platform-budget-resume-20261102, lane20/expanded-source-production-20261102, lane20/recovered-publisher-fix-20261102, lane20/recovery-catalog-production-20261102, lane20/unstarted-recovery-20261102, lane20/measured-source-throughput-20261102, lane20/rollback-policy-20261102, lane20/checkpoint-inspection-20261102, lane20/checkpoint-salvage-20261102, lane20/verified-overview-pilot-20261102, lane20/overview-recovery-reader-fix-20261102, lane20/finite-overview-queue-20261102, lane20/pre-admission-recovery-20261103, lane20/active-run-pagination-20261103]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  isolated-offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 444fa31cab3e321bc6e93b32b315efaba1ed24cd
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Source identity, single-owner dispatch, response-loss and authorized resume regression tests
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p test_rrgh_dispatcher.py -v
      - name: Read-only GitHub retry and unclaimed admission reconciliation guards
        run: python -m unittest discover -s .github/automation -p test_rrgh_pre_admission.py -v
      - name: Complete active-run inventory, bounded read retries and exact recovered resume
        run: python -m unittest discover -s .github/automation -p test_rrgh_active_run_inventory.py -v
      - name: Expanded catalog, native metadata, rollback and no-replay tests
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p test_rrgh_expanded_production.py -v
      - name: Unstarted recovery identity, no-replay and split-execution audit
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p test_rrgh_recovery_only.py -v
      - name: Bounded checkpoint inspection ownership and read-only auth refresh
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p test_rrgh_checkpoint_diagnostics.py -v
      - name: Credential refresh, exact checkpoint salvage, source pins and quarantine continuation
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p 'test_rrgh_*salvage*.py' -v
      - name: Exact overview integration, source-free allocation and parent recomputation guards
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p 'test_rrgh_*overview*.py' -v
      - name: Existing immutable checkpoint and selective cache recovery regression tests
        working-directory: source-checkout/backend/scripts
        run: python -m unittest test_gorge_checkpoint test_gorge_compact_forecast -v
      - name: Exact package membership, catalog mutation and optional-evidence isolation
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: python -m unittest discover -s .github/automation -p 'test_rrgh_*catalog*.py' -v
      - name: Real engine full-quality configuration and resource admission
        run: python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - name: Two synthetic offline recover-plan-publish roundtrips; no Cloud credentials or writes
        env:
          RRGH_TEST_OVERVIEW_PILOT: '1'
        run: python .github/automation/verify_rrgh_dispatch_roundtrip.py source-checkout
      - uses: actions/checkout@v4
        with:
          ref: 4d21eecdfa6efac46f870d6f4726d36ed772afb4
          path: salvage-source
          persist-credentials: false
      - name: Original wave105 salvage then two fresh synthetic successors with preserved quarantines
        run: python .github/automation/verify_rrgh_salvage_roundtrip.py salvage-source
      - uses: actions/checkout@v4
        with:
          ref: 7225d8659c752598a6dc0258e5514e68d2b44fa4
          path: overview-migration-source
          persist-credentials: false
      - name: Actual installed overview helper migration and trusted publication roundtrip
        env:
          RRGH_TEST_OVERVIEW_PILOT: '1'
        run: python .github/automation/verify_rrgh_dispatch_roundtrip.py overview-migration-source
