name: Backend Package Delivery CI

on:
  push:
    branches:
      - backend/protected-package-delivery-v1
  pull_request:
    branches:
      - backend/phase-3-nonprod
    paths:
      - "backend/**"
      - ".github/workflows/backend-package-delivery-ci.yml"
      - ".github/workflows/backend-nonprod-deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify shell and JavaScript syntax
        run: |
          bash -n backend/scripts/build-gorge-base.sh
          bash -n backend/scripts/stage-governed-route-packages.sh
          node --check backend/scripts/seed-package-catalog.mjs
          node --check backend/scripts/nonprod-remote-smoke.mjs
          node --check backend/functions/src/index.js
          node --check backend/functions/src/store.js
          node --check backend/functions/src/delivery.js

      - name: Verify nonproduction guardrails
        run: node backend/scripts/phase3-readiness.mjs

      - name: Install backend dependencies
        run: npm install --prefix backend/functions --no-audit --no-fund

      - name: Run Firebase emulator contract with deny-all Storage
        working-directory: backend
        run: >
          npx --yes firebase-tools@15.30.2 emulators:exec
          --project demo-rrgh-entitlements
          --only auth,firestore,functions,storage
          "npm --prefix functions test"

  governed-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate keylessly for private governed source reads
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/github-actions/providers/rrgh-nonprod
          service_account: github-deploy@rrgh-nonproduction.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: >-
            https://www.googleapis.com/auth/cloud-platform
            https://www.googleapis.com/auth/drive.readonly

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction

      - name: Verify private Drive source access without publishing bytes
        shell: bash
        run: |
          set -euo pipefail

          gcloud services list \
            --enabled \
            --project=rrgh-nonproduction \
            --filter='config.name:drive.googleapis.com' \
            --format='value(config.name)' \
            | grep -Fx 'drive.googleapis.com'

          export GOOGLE_OAUTH_ACCESS_TOKEN="${{ steps.google-auth.outputs.access_token }}"
          test -n "$GOOGLE_OAUTH_ACCESS_TOKEN"

          ROUTE_DIR="$RUNNER_TEMP/rrgh-governed-route-preflight"
          bash backend/scripts/stage-governed-route-packages.sh "$ROUTE_DIR"

          test "$(stat -c '%s' "$ROUTE_DIR/route-rte-0001.geojson")" = "8201"
          test "$(stat -c '%s' "$ROUTE_DIR/route-rte-0002.geojson")" = "6533"
          rm -rf "$ROUTE_DIR"
