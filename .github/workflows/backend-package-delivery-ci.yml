name: Backend Package Delivery CI

on:
  push:
    branches:
      - backend/protected-package-delivery-v1
  pull_request:
    branches:
      - backend/phase-3-nonprod
    paths:
      - "backend/**"
      - ".github/workflows/backend-package-delivery-ci.yml"
      - ".github/workflows/backend-nonprod-deploy.yml"

permissions:
  contents: read

jobs:
  delivery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify shell and JavaScript syntax
        run: |
          bash -n backend/scripts/build-gorge-base.sh
          bash -n backend/scripts/stage-governed-route-packages.sh
          node --check backend/scripts/seed-package-catalog.mjs
          node --check backend/scripts/nonprod-remote-smoke.mjs
          node --check backend/scripts/ensure-offline-lease-keyring.mjs
          node --check backend/functions/src/index.js
          node --check backend/functions/src/store.js
          node --check backend/functions/src/delivery.js
          node --check backend/functions/src/offlineLease.js

      - name: Verify schema-4 offline package source integrity (no network)
        run: |
          set -euo pipefail
          python3 -m py_compile backend/scripts/build_gorge_base_native_v4.py backend/scripts/test_build_gorge_base_native_v4.py
          python3 -m unittest discover -s backend/scripts -p 'test_build_gorge_base_native_v4.py' -v
          python3 -m py_compile backend/scripts/import_official_tpkx_xyz.py backend/scripts/test_import_official_tpkx_xyz.py
          python3 -m py_compile backend/scripts/http_range_zip.py backend/scripts/test_http_range_zip.py
          python3 -m unittest discover -s backend/scripts -p 'test_http_range_zip.py' -v
          python3 -m py_compile backend/scripts/compact_v2_range_extract.py backend/scripts/test_compact_v2_range_extract.py
          python3 -m unittest discover -s backend/scripts -p 'test_compact_v2_range_extract.py' -v
          python3 -m unittest discover -s backend/scripts -p 'test_import_official_tpkx_xyz.py' -v
          python3 -m py_compile backend/scripts/discover_official_ky_county_sources.py backend/scripts/test_discover_official_ky_county_sources.py
          python3 -m unittest discover -s backend/scripts -p 'test_discover_official_ky_county_sources.py' -v
          python3 -m py_compile backend/scripts/probe_official_ky_tpkx_metadata.py backend/scripts/test_probe_official_ky_tpkx_metadata.py
          python3 -m unittest discover -s backend/scripts -p 'test_probe_official_ky_tpkx_metadata.py' -v

      - name: Discover county offline package metadata (no imagery download)
        id: official_sources
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 backend/scripts/discover_official_ky_county_sources.py \
            --output-json "${{ runner.temp }}/official-ky-county-metadata.json"

      - name: Preserve public source metadata for vetted local package intake
        if: steps.official_sources.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-kentucky-county-tpkx-metadata
          path: ${{ runner.temp }}/official-ky-county-metadata.json
          retention-days: 2

      - name: Probe official county archive sizes without downloading them
        id: official_sizes
        if: steps.official_sources.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 backend/scripts/probe_official_ky_tpkx_metadata.py \
            --official-index-json "${{ runner.temp }}/official-ky-county-metadata.json" \
            --output-json "${{ runner.temp }}/official-ky-source-sizes.json"

      - name: Preserve read-only county package size inventory
        if: steps.official_sizes.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-kentucky-county-tpkx-size-probe
          path: ${{ runner.temp }}/official-ky-source-sizes.json
          retention-days: 2

      - name: Probe genuine Powell leaf-off aerial at zoom levels 13–16 without whole-county download
        id: selective_tpkx_pilot
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/rrgh-powell-pilot"
          cat > "${{ runner.temp }}/powell-source-provenance.json" <<'PROVENANCE'
          {
            "publisher": "Kentucky Division of Geographic Information",
            "sourceTitle": "Powell KyFromAbove 2019 6-inch leaf-off imagery TPKX",
            "sourceURL": "https://ky.box.com/shared/static/zi0ltrlzlx39ashp232dt37cdj0utem1.tpkx",
            "licenseURL": "https://kyfromabove.ky.gov/",
            "attribution": "KyFromAbove / Kentucky DGI (public-domain data with requested attribution)",
            "verifiedOfflineReuse": true
          }
          PROVENANCE
          python3 backend/scripts/import_official_tpkx_xyz.py \
            --tpkx-url "https://ky.box.com/shared/static/zi0ltrlzlx39ashp232dt37cdj0utem1.tpkx" \
            --approved-xyz-root "${{ runner.temp }}/rrgh-powell-pilot" \
            --layer-id leaf-off-aerial \
            --bbox -83.689 37.773 -83.685 37.777 \
            --min-zoom 13 --max-zoom 16 \
            --approved-provenance "${{ runner.temp }}/powell-source-provenance.json" \
            --max-remote-bytes 60000000

      - name: Retain only bounded publicly sourced Powell pilot tiles
        if: steps.selective_tpkx_pilot.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: official-kentucky-powell-leafoff-pilot-qa
          path: ${{ runner.temp }}/rrgh-powell-pilot/
          retention-days: 1

      - name: Verify nonproduction guardrails
        run: node backend/scripts/phase3-readiness.mjs

      - name: Install backend dependencies
        run: npm install --prefix backend/functions --no-audit --no-fund

      - name: Run Firebase emulator contract with deny-all Storage
        working-directory: backend
        run: >
          npx --yes firebase-tools@15.30.2 emulators:exec
          --project demo-rrgh-entitlements
          --only auth,firestore,functions,storage
          "npm --prefix functions test"


  gorge-base-v3-preflight:
    name: Gorge Base v3 real-build preflight
    # This ephemeral build never publishes protected offline map geometry
    # or an installable package to an Actions artifact/public repository.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Install trusted source-conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdal-bin osmium-tool unzip

      - name: Build actual immutable Gorge Base candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/rrgh-gorge-base-preflight"
          PACKAGE_VERSION="2026.10.08.1"
          bash backend/scripts/build-gorge-base.sh "$BASE_DIR" "$PACKAGE_VERSION"

          PKG="$BASE_DIR/gorge-base-$PACKAGE_VERSION.rrghpkg"
          MANIFEST="$BASE_DIR/gorge-base-manifest.json"
          NATIVE="$BASE_DIR/root/NATIVE-MAP.json"
          test -s "$PKG" && test -s "$MANIFEST" && test -s "$NATIVE"
          test "$(jq -r '.packageID' "$MANIFEST")" = "gorge-base"
          test "$(jq -r '.version' "$MANIFEST")" = "$PACKAGE_VERSION"
          test "$(jq -r '.sources | length' "$MANIFEST")" = "20"
          test "$(jq -r '.schemaVersion' "$NATIVE")" = "3"
          test "$(jq -r '.baseRasters | length' "$NATIVE")" = "5"
          test "$(jq -r '.vectors | length' "$NATIVE")" = "13"
          test "$(jq -r '.staticAssets | length' "$NATIVE")" -ge 125
          test "$(sha256sum "$PKG" | awk '{print $1}')" = "$(jq -r '.sha256' "$MANIFEST")"
          test "$(stat -c '%s' "$PKG")" = "$(jq -r '.byteCount' "$MANIFEST")"
          tar -tf "$PKG" | grep -Fx './NATIVE-MAP.json'
          tar -tf "$PKG" | grep -Fx './native/base/leaf-off-aerial.jpg'
          tar -tf "$PKG" | grep -Fx './native/website/data/map/weather/manifest.json'

          # Save aggregate evidence only. Never upload a package or its
          # protected content as a GitHub Actions artifact.
          echo "Gorge Base $PACKAGE_VERSION full-source preflight passed." >> "$GITHUB_STEP_SUMMARY"
          echo "Sources: $(jq '.sources | length' "$MANIFEST")" >> "$GITHUB_STEP_SUMMARY"
          echo "Native rasters: $(jq '.baseRasters | length' "$NATIVE")" >> "$GITHUB_STEP_SUMMARY"
          echo "Native vectors: $(jq '.vectors | length' "$NATIVE")" >> "$GITHUB_STEP_SUMMARY"
          echo "Static indexed assets: $(jq '.staticAssets | length' "$NATIVE")" >> "$GITHUB_STEP_SUMMARY"
          echo "Package SHA256: $(jq -r '.sha256' "$MANIFEST")" >> "$GITHUB_STEP_SUMMARY"
