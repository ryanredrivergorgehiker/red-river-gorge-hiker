name: RRGH authorized controller launch
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/automation/rrgh-controller-request.json]
permissions:
  contents: write
  actions: write
concurrency:
  group: rrgh-controller-initial-launch
  cancel-in-progress: false
jobs:
  launch:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.actor == 'ryanredrivergorgehiker' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the owner-authenticated request
        id: request
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          request=json.loads(Path('.github/automation/rrgh-controller-request.json').read_bytes())
          action=request.get('action','launch')
          assert action in ('launch','resume-recovered','resume-published','recover-checkpoints','recover-unstarted','inspect-halted','salvage-halted','resume-unclaimed','complete-halted')
          source=request.get('source_sha','')
          if action in ('resume-recovered','resume-published','recover-checkpoints','recover-unstarted','inspect-halted','salvage-halted','complete-halted'):
              assert re.fullmatch('[0-9a-f]{40}',source)
              state=json.loads(Path('.github/automation/rrgh-controller-state.json').read_bytes())
              assert source==state['sourceSHA'] and (state['status']=='halted' or
                  (action=='resume-recovered' and state['status']=='completion-waiting' and state.get('crosswavePolicy')))
          if action=='resume-unclaimed':
              assert re.fullmatch('[0-9a-f]{40}',source)
              state=json.loads(Path('.github/automation/rrgh-controller-state.json').read_bytes())
              assert source==state['sourceSHA'] and state['status']=='dispatching' and state.get('runID') is None
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('action='+action+'\nsource='+source+'\n')
          PY
      - name: Claim and dispatch the exact restricted authentication probe
        if: steps.request.outputs.action == 'launch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py launch
      - name: Reconcile the exact already-published successor without replaying source or Cloud writes
        if: steps.request.outputs.action == 'resume-published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_handoff.py resume-published
      - name: Recover exact saved native checkpoints through the unused verification slot
        if: steps.request.outputs.action == 'recover-checkpoints'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_handoff.py recover-checkpoints
      - name: Dispatch recovery only after proving its original execution never started
        if: steps.request.outputs.action == 'recover-unstarted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py recover-unstarted
      - name: Reconcile an unclaimed admission failure and dispatch an unused-allocation probe
        if: steps.request.outputs.action == 'resume-unclaimed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py resume-unclaimed
      - name: Dispatch bounded read-only inspection of the exact halted allocation
        if: steps.request.outputs.action == 'inspect-halted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py inspect-halted
      - name: Complete the exact consumed recovery using a separately funded source-free slot
        if: steps.request.outputs.action == 'complete-halted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py complete-halted
      - name: Dispatch the exact independently inspected checkpoint salvage
        if: steps.request.outputs.action == 'salvage-halted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py salvage-halted
      - name: Revalidate the exact completed production and independent recovery
        if: steps.request.outputs.action == 'resume-recovered'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py audit-recovered --output "$RUNNER_TEMP/recovery.json"
      - uses: actions/checkout@v4
        if: steps.request.outputs.action == 'resume-recovered'
        with:
          ref: ${{ steps.request.outputs.source }}
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        if: steps.request.outputs.action == 'resume-recovered'
        with:
          python-version: '3.12'
      - name: Prepare the fresh successor without GitHub credentials in the source process
        if: steps.request.outputs.action == 'resume-recovered'
        run: |
          python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
          python .github/automation/rrgh_prepare_dispatch_successor.py source-checkout "$RUNNER_TEMP/recovery.json"
          python source-checkout/backend/scripts/gorge_campaign.py --phase plan
      - name: Publish the verified successor and dispatch a new production allocation
        if: steps.request.outputs.action == 'resume-recovered'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_dispatcher.py publish-recovered --source source-checkout --audit "$RUNNER_TEMP/recovery.json"
