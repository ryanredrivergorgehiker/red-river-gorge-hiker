name: Pinterest Catalog Image Probe

on:
  push:
    branches:
      - catalog-stage1-automation-20260909

permissions:
  contents: read

jobs:
  image-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe approved and Store preview image dimensions
        run: node scripts/probe-pinterest-catalog-images.mjs
