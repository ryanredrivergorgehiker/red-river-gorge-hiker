name: RRGH native repair batch QA
on:
  push:
    branches: [lane20/native-repair-batches-20261110]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: source-checkout
jobs:
  finite-repair-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 230f3c6097af85cb7e093b9a81a68c5cc3b9ff51
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Actual wave1419 through the complete finite repair queue and verified hold
        run: python .github/automation/verify_rrgh_native_batch_roundtrip.py source-checkout
      - name: Preserve handoff, publication, completion and historical pilot paths
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_native_repair.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_native_transport.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_published_successor.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_completion_throughput.py -v
      - name: Preserve renderer pixel and global attempt guards
        working-directory: source-checkout/backend/scripts
        run: |
          python -m unittest test_gorge_checkpoint test_gorge_source_gap_guard -v
