name: Import Aug 12 staging assets once

on:
  push:
    branches:
      - feature/aug12-analytics-pricing-puzzles-sharing
    paths:
      - .github/workflows/import-aug12-staging-assets-once.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/aug12-analytics-pricing-puzzles-sharing
          fetch-depth: 0

      - name: Download verified Drive transport package
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1yMlbOUtBQN-vWjwlWfDE5ui1ziVZrkWg&export=download&confirm=t' \
            -o /tmp/rrgh-aug12-staging-assets.zip
          echo '92631c81a953de11659e0dfebd9e435f4df90305b70a74fd02fe4185e8932dc7  /tmp/rrgh-aug12-staging-assets.zip' | sha256sum -c -

      - name: Install and validate assets
        shell: bash
        run: |
          set -euo pipefail
          unzip -o /tmp/rrgh-aug12-staging-assets.zip -d .
          echo '7e209485be3081e2630029b3b4f970c349d22179c10d530f648e60f64781111e  public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf' | sha256sum -c -
          echo 'c4336382629bd9cd3872717a567f0f33e21e2a4811b66bac02eab80d0a70f1e8  public/assets/puzzles/winter-at-red-byrd-arch-puzzle.avif' | sha256sum -c -
          echo '356090877c397b2d2e61bcc27287b09ddc85c2a0cab72b60c0f1f99398d7f193  public/assets/puzzles/sunrise-at-eagles-nest-puzzle.avif' | sha256sum -c -
          echo '93b26d8d9ec7f99d7bc36d4eebda3695a3b509e50066397bdb366471395fc4dc  public/assets/puzzles/ice-at-west-of-copperas-pillar-puzzle.avif' | sha256sum -c -

      - name: Remove one-time importer and commit assets
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-aug12-staging-assets-once.yml
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf public/assets/puzzles .github/workflows/import-aug12-staging-assets-once.yml
          git commit -m 'Refresh DBNF guide and add approved puzzle product images'
          git push origin HEAD:feature/aug12-analytics-pricing-puzzles-sharing
