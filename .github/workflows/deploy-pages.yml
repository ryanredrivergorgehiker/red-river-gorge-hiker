name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate controlled Pinterest Stage 1 catalog feed
        run: node scripts/generate-pinterest-art-catalog.mjs --output-dir public/feeds

      - name: Verify Pinterest catalog contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = fs.readFileSync('public/feeds/pinterest-art-catalog.csv', 'utf8').trimEnd().split(/\r?\n/);
          if (lines.length !== 47) throw new Error(`Expected header + 46 rows, found ${lines.length} lines`);
          const manifest = JSON.parse(fs.readFileSync('public/feeds/pinterest-art-catalog-manifest.json', 'utf8'));
          if (manifest.itemCount !== 46 || manifest.rows.length !== 46) throw new Error('Pinterest catalog item count mismatch');
          if (!manifest.noGear || manifest.paidCampaignChanged) throw new Error('Pinterest Stage 1 scope boundary failure');
          console.log('Pinterest catalog contract PASS: 46 photography-commerce items, no Gear, no paid change.');
          NODE

      - name: Run checks
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy production site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
