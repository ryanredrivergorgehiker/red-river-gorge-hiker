name: Catalog PR Dependency Audit Remediation

on:
  push:
    branches:
      - catalog-stage1-automation-20260909

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: catalog-stage1-automation-20260909
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply lockfile-only audit fixes within existing semver ranges
        run: npm audit fix --package-lock-only
      - name: Verify package manifest did not change
        shell: bash
        run: |
          if ! git diff --quiet -- package.json; then
            echo 'package.json changed unexpectedly; refusing automatic dependency remediation.'
            git diff -- package.json
            exit 1
          fi
      - name: Verify audit gates after fix
        run: |
          npm ci
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile update when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile update needed.'
            exit 0
          fi
          git config user.name 'RRGH Dependency Maintenance'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add package-lock.json
          git commit -m 'Refresh dependency lockfile for current security advisories'
          git push origin HEAD:catalog-stage1-automation-20260909
