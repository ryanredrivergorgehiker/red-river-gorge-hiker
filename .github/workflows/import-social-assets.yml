name: Import approved social assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-social-assets.yml

permissions:
  contents: write

jobs:
  import-social-assets:
    name: Import approved social assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download approved Drive archive
        env:
          ARCHIVE_URL: https://drive.google.com/uc?export=download&id=1yMlbOUtBQN-vWjwlWfDE5ui1ziVZrkWg
          ARCHIVE_SHA256: 74938e8d1d4460c9cdcd0a37d2bdc25107723c729dbe588815647c6ec01330ff
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/rrgh-social-assets.zip "$ARCHIVE_URL"
          echo "$ARCHIVE_SHA256  /tmp/rrgh-social-assets.zip" | sha256sum --check --strict

      - name: Verify archive manifest and social derivatives
        run: |
          set -euo pipefail
          rm -rf /tmp/rrgh-social-assets
          mkdir -p /tmp/rrgh-social-assets
          unzip -q /tmp/rrgh-social-assets.zip -d /tmp/rrgh-social-assets
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('/tmp/rrgh-social-assets')
          manifest = json.loads((root / 'social-asset-manifest.json').read_text())

          assert manifest['releaseVersion'] == 'social-assets-v01'
          assert manifest['brand'] == 'Red River Gorge Hiker'
          expected_catalog = [
              'RRGH-0001',
              'RRGH-0004',
              'RRGH-0005',
              'RRGH-0002',
              'RRGH-0007',
              'RRGH-0003',
          ]
          assert [item['catalogId'] for item in manifest['files']] == expected_catalog
          assert len(manifest['files']) == 6

          expected_paths = {'social-asset-manifest.json'}
          for item in manifest['files']:
              assert item['watermarkedSocialDerivative'] is True
              relative = Path(item['publicPath'])
              assert relative.parts[:3] == ('public', 'assets', 'social')
              assert relative.name.endswith('-SOCIAL-WM.jpg')
              expected_paths.add(relative.as_posix())
              path = root / relative
              assert path.is_file(), relative
              assert path.stat().st_size == item['fileSize'], relative
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], relative

          actual_paths = {
              path.relative_to(root).as_posix()
              for path in root.rglob('*')
              if path.is_file()
          }
          assert actual_paths == expected_paths, sorted(actual_paths ^ expected_paths)
          print('Approved social asset archive validated: 6 JPEGs plus manifest.')
          PY

      - name: Stage only approved social assets
        run: |
          set -euo pipefail
          mkdir -p public/assets/social
          cp /tmp/rrgh-social-assets/public/assets/social/*-SOCIAL-WM.jpg public/assets/social/
          cp /tmp/rrgh-social-assets/social-asset-manifest.json public/assets/social/manifest.json

          git add public/assets/social/*-SOCIAL-WM.jpg public/assets/social/manifest.json
          git rm .github/workflows/import-social-assets.yml
          git diff --cached --check

          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/import-social-assets.yml|public/assets/social/manifest.json|public/assets/social/*-SOCIAL-WM.jpg) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "8"

      - name: Commit approved public social assets and remove importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import approved public social assets"
          git push origin HEAD:main
