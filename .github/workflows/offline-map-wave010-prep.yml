name: RRGH Wave010 new-geography plan (offline, no cloud)
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-wave010-prep.yml]
permissions:
  contents: write
concurrency:
  group: rrgh-wave010-offline-prep
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: validate new-territory wave010 source-backed plan 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43804d86d9042ab69d6a2dd88dd61ee62b03bf6d
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked map processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Check strict source-gap fault quarantine stays fail-closed
        run: python backend/scripts/test_gorge_source_gap_guard.py -v
      - name: Generate new-geography candidate from original pinned imagery inventory
        shell: bash
        run: |
          python - <<'PY'
          import base64,copy,json,sys,zlib
          from collections import Counter
          from pathlib import Path
          sys.path.insert(0,'backend/scripts')
          from gorge_checkpoint import canonical,digest
          from gorge_campaign_budget import admit,cost
          from run_gorge_checkpoint_slot import code_snapshot
          from forecast_gorge_checkpoint_campaign import bbox,coords,intersects,morton,PROFILES
          from gorge_campaign import configuration
          
          src=Path('backend/config/gorge-campaign-wave-009-20261030')
          dst=Path('backend/config/gorge-campaign-wave-010-20261030')
          # Pin canonical producer to next immutable scope before hashing it.
          campaign_py=Path('backend/scripts/gorge_campaign.py')
          previous_config="CONFIG=SOURCE.parent/'config/gorge-campaign-wave-009-20261030'"
          next_config="CONFIG=SOURCE.parent/'config/gorge-campaign-wave-010-20261030'"
          original_source=campaign_py.read_text()
          assert original_source.count(previous_config)==1
          campaign_py.write_text(original_source.replace(previous_config,next_config))
          old=json.loads((src/'PLAN.json').read_bytes())
          env=json.loads((src/'ALLOWANCE.json').read_bytes())
          region=json.loads(zlib.decompress(base64.b64decode((src/'REGION-PLAN.json.z.b64').read_bytes())))
          assert old['campaign']['sequence']==9
          assert len(old['completedJobIDs'])==1018 and len(old['approvedJobIDs'])==224
          assert old['approvedJobIDs']==[j['id'] for j in region['jobs']]
          assert Counter(j['layer'] for j in region['jobs'])=={'hiking':96,'usgs-topo':64,'leaf-on':64}
          assert sum(len(j['outputTiles']) for j in region['jobs'])==1888
          
          # Wave009 zero-output partial recovery carries forward full conservatively retained allocation.
          recovery={'bytes':1487,'generation':'1793398007723150',
           'key':'engineering/map-production/plans/6f5590d4d5115cf74a19a3259dbd8b549f8f57b32c8c52a91c360e335c361ff2/slots/00002/receipt.json',
           'sha256':'f908e5619dd02512c2635f51aadb2b3a099a7ff2e6afec34edc2d17958cd7300'}
          carry={'chargedUSD':'4.931985303892749547958374024',
           'storedBytes':11110414026,'priorCompletedJobs':1018,
           'priorRasterTiles':9954,'priorSunlightAssets':320}
          accepted=old['completedJobIDs'][:]
          assert len(accepted)==1018 and len(set(accepted))==1018
          # Wave009 recovered ZERO new completed jobs. Preserve 15 spent gaps.
          new_gaps={'hiking-16-17535-25317','hiking-16-17534-25318',
                    'hiking-16-17535-25318','hiking-16-17534-25319',
                    'hiking-16-17534-25320','hiking-16-17535-25320',
                    'hiking-16-17534-25321','hiking-16-17535-25321',
                    'hiking-16-17534-25322','hiking-16-17535-25322',
                    'hiking-16-17534-25323','hiking-16-17535-25323',
                    'hiking-16-17534-25324','hiking-16-17535-25324',
                    'hiking-16-17534-25325'}
          assert len(new_gaps)==15 and new_gaps.issubset(set(old['approvedJobIDs']))
          assert not set(old['approvedJobIDs'])&set(accepted)
          previous_attempts=old['priorAttemptCounts']
          prior_quarantined={'leaf-off-16-17548-25317','terrain-16-17538-25318',
                             'leaf-on-16-17550-25323','hiking-16-17535-25319'}
          quarantined=prior_quarantined|new_gaps
          assert all(previous_attempts.get(q,0)==1 and q not in accepted for q in prior_quarantined)
          assert all(previous_attempts.get(q,0)==0 and q not in accepted for q in new_gaps)
          
          # Reconstruct only current-inventory-covered z16 windows; any tile that
          # merely intersects a COG bbox remains subject to full native pixel QA.
          grids={z:coords(z) for z in (16,17,18)}
          index={}
          missing={}
          for group,layers in PROFILES.items():
              for layer,maxz in layers.items():
                  family='dem' if layer=='terrain' else layer
                  sources=region['inventory']['sources'].get(family,[])
                  gaps=0
                  for x,y in sorted(grids[16],key=lambda xy:morton(*xy)):
                      if layer=='usgs-topo':
                          sources_for_job=[]
                      else:
                          box=bbox(16,x,y,1/512 if layer=='terrain' else 0)
                          sources_for_job=[f['id'] for f in sources if intersects(f['bbox'],box)]
                          if not sources_for_job:
                              gaps+=1
                              continue
                      tiles=[]
                      for z in range(16,maxz+1):
                          n=2**(z-16)
                          for dx in range(n):
                              for dy in range(n):
                                  xx,yy=x*n+dx,y*n+dy
                                  if (xx,yy) in grids[z]:tiles.append([z,xx,yy])
                      jid=f'{layer}-16-{x}-{y}'
                      assert tiles and jid not in index
                      index[jid]={'id':jid,'layer':layer,'group':group,'z':16,'x':x,'y':y,
                          'operation':'usgs-tile' if layer=='usgs-topo' else 'source-window',
                          'sourceIDs':sources_for_job,'dependencies':[],'outputTiles':tiles,'preservedComplete':False}
                  missing[layer]=gaps
          assert len(index)==11940 and sum(missing.values())==13960
          for prior in region['jobs']:
              reference=index[prior['id']]
              assert prior['sourceIDs']==reference['sourceIDs']
              assert prior['outputTiles']==reference['outputTiles']
          
          # Proven successful families first; terrain/leaf-off deferred until source
          # pixel-validity survey. Select next unused z16 neighbors of verified tiles.
          # Defer all new hiking plus terrain/leaf-off pending original valid-pixel audit.
          # Topo and leaf-on were previously verified; native checks remain strict.
          limits={'usgs-topo':64,'leaf-on':64}
          selected=[]
          for layer,limit in limits.items():
              landmarks=[index[jid] for jid in accepted if jid in index and index[jid]['layer']==layer]
              assert landmarks
              coords_done=[(j['x'],j['y']) for j in landmarks]
              eligible=[j for j in index.values() if j['layer']==layer
                  and j['id'] not in accepted and j['id'] not in quarantined
                  and previous_attempts.get(j['id'],0)==0
                  and (j['sourceIDs'] or layer=='usgs-topo')]
              eligible.sort(key=lambda j:(min(abs(j['x']-x)+abs(j['y']-y) for x,y in coords_done),
                                          morton(j['x'],j['y']),j['id']))
              pick=eligible[:limit]
              assert len(pick)==limit,(layer,len(pick))
              pick.sort(key=lambda j:(tuple(j['sourceIDs']),morton(j['x'],j['y']),j['id']))
              selected.extend(pick)
          
          ids=[j['id'] for j in selected]
          assert len(ids)==128 and len(set(ids))==128
          assert not set(ids)&(set(accepted)|quarantined)
          assert Counter(j['layer'] for j in selected)==limits
          expected_tiles=sum(len(j['outputTiles']) for j in selected)
          assert expected_tiles==1408,(expected_tiles,len(ids))
          
          # Same established conservative funding envelope, new immutable sequence.
          plan=copy.deepcopy(old)
          plan['campaign']['sequence']=10
          plan['campaign']['previousRecovery']=recovery
          plan['campaign']['carry']=carry
          plan['completedJobIDs']=accepted
          plan['approvedJobIDs']=ids
          plan['slotJobs']={'1':ids}
          prior_attempts=plan['priorAttemptCounts']
          for jid in new_gaps:
              prior_attempts[jid]=prior_attempts.get(jid,0)+1
          assert all(prior_attempts[jid]==1 for jid in quarantined)
          assert all(0<=v<=2 for v in prior_attempts.values())
          assert not set(plan['completedJobIDs'])&set(plan['approvedJobIDs'])
          
          # Inherit exactly the per-layer guardrails from already-accepted jobs.
          bylayer={}
          for jid,policy in old['jobPolicies'].items():
              layer=jid.rsplit('-',3)[0]
              if layer in bylayer:assert bylayer[layer]==policy
              else:bylayer[layer]=policy
          for jid in accepted:
              if jid.rsplit('-',3)[0]=='hiking':
                  # Historical policy is retained in Wave005 (not regenerated).
                  pass
          wave005=json.loads(Path('backend/config/gorge-campaign-wave-005-20261030/PLAN.json').read_bytes())
          for jid,policy in wave005['jobPolicies'].items():
              layer=jid.rsplit('-',3)[0]
              if layer in bylayer:assert bylayer[layer]==policy
              else:bylayer[layer]=policy
          assert all(l in bylayer for l in limits)
          plan['jobPolicies']={j['id']:bylayer[j['layer']] for j in selected}
          plan['slots'][1]['attempts']=128
          plan['limits']['attempts']=128
          region['jobs']=selected
          region['engineHashes']['gorge_campaign.py']=digest(Path('backend/scripts/gorge_campaign.py').read_bytes())
          plan['regionPlanSHA256']=digest(canonical(region))
          plan['sourceSnapshotSHA256']=code_snapshot(Path('backend/scripts'))
          env['cloudStorageAllowance']['approvedUSD']='0.6456'
          env['cloudStorageAllowance']['reservedWorstCaseUSD']=str(cost(plan['limits']))
          env['cloudStorageAllowance']['planSHA256']=digest(canonical(plan))
          ad=admit(plan,env)
          assert ad['reserveUSD']==env['cloudStorageAllowance']['reservedWorstCaseUSD']
          assert float(ad['cumulativeAdmissionUSD'])<25
          assert float(ad['monthlyAdmissionUSD'])<1
          dst.mkdir(parents=True,exist_ok=False)
          (dst/'PLAN.json').write_bytes(canonical(plan))
          (dst/'ALLOWANCE.json').write_bytes(canonical(env))
          (dst/'REGION-PLAN.json.z.b64').write_bytes(base64.b64encode(zlib.compress(canonical(region),9)))
          p,e,r=configuration(dst)
          assert p['completedJobIDs']==accepted and p['approvedJobIDs']==ids
          assert p['campaign']['previousRecovery']==recovery
          assert p['campaign']['carry']==carry
          assert p['sourceSnapshotSHA256']==code_snapshot(Path('backend/scripts'))
          assert p['regionPlanSHA256']==digest(canonical(r))
          print(json.dumps({'phase':'verified-offline-wave010','jobs':len(ids),
           'tiles':expected_tiles,'previouslyRecoveredJobs':len(accepted),
           'quarantines':sorted(quarantined),
           'sourceWindowGapsByLayer':missing,'planSHA256':digest(canonical(p)),
           'sourceSnapshotSHA256':p['sourceSnapshotSHA256'],'admission':ad},sort_keys=True))
          PY
      - name: Commit only canonical new immutable scope on exactly pinned engineering ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "43804d86d9042ab69d6a2dd88dd61ee62b03bf6d"
          git fetch origin refs/heads/lane20/map-producer-iam-design-20261029
          test "$(git rev-parse FETCH_HEAD)" = "43804d86d9042ab69d6a2dd88dd61ee62b03bf6d"
          git config user.name 'rrgh-plan-prep[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/scripts/gorge_campaign.py backend/config/gorge-campaign-wave-010-20261030/ALLOWANCE.json backend/config/gorge-campaign-wave-010-20261030/PLAN.json backend/config/gorge-campaign-wave-010-20261030/REGION-PLAN.json.z.b64
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git commit -m 'Lane20: persist verified wave010 source-backed successor [skip ci]'
          git push origin HEAD:refs/heads/lane20/map-producer-iam-design-20261029
      - name: Preserve limited-duration metadata-only review
        uses: actions/upload-artifact@v4
        with:
          name: rrgh-wave010-review-only
          path: backend/config/gorge-campaign-wave-010-20261030/
          retention-days: 1
          if-no-files-found: error
# Offline planning only. Temporary contents:write must be retired after plan commit. No GCS credentials, source images, map production or public deployment.