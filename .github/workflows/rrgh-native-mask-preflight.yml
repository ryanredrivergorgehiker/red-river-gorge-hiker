name: RRGH remaining native source mask preflight
on:
  push:
    branches: [lane20/native-source-mask-preflight-20261110]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  GDAL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  source-mask-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 895c01953481b2b5825abee9a4c0681f37211eb4
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Read bounded original source masks without consuming production attempts
        run: timeout 3050 python .github/automation/rrgh_native_mask_preflight.py source-checkout .github/automation/fixtures/native-mask-candidates-20261110.json "$RUNNER_TEMP/native-mask-results.json"
