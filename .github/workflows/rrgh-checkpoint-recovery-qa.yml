name: RRGH checkpoint recovery offline QA
on:
  push:
    branches: [lane20/checkpoint-recovery-20261105, lane20/checkpoint-audit-isolation-20261105]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: source-checkout
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: eecdc4a33eea60de48bd7715eace96b155c4285f
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Recovery, ownership, credential and interrupted-publication regressions
        env:
          RRGH_TEST_SOURCE: source-checkout
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_checkpoint_recovery.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_checkpoint_salvage.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_checkpoint_diagnostics.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_state_reconciliation.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_pre_admission.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_active_run_inventory.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_published_successor.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_log_reads.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_dispatcher.py -v
      - name: Exact-source checkpoint recovery and two fresh successor roundtrips
        run: python .github/automation/verify_rrgh_checkpoint_roundtrip.py source-checkout
