name: Import vetted DBNF guide and refine SAR staging copy

on:
  push:
    branches:
      - feature/gear-20-card-refresh
    paths:
      - .github/workflows/import-dbnf-guide-and-refine-sar.yml

permissions:
  contents: write

jobs:
  import-and-refine:
    name: Import guide, refine SAR copy, test, and clean up
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/gear-20-card-refresh
          fetch-depth: 0

      - name: Download vetted DBNF guide transport
        env:
          GUIDE_URL: https://drive.google.com/uc?export=download&id=1yMlbOUtBQN-vWjwlWfDE5ui1ziVZrkWg
          GUIDE_SHA256: 9945908c99ec376d1447b190fcb305ed92b7bcd0add73974751ead5ab32d982d
          GUIDE_SIZE: '12518681'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/dbnf-guide.pdf "$GUIDE_URL"
          test "$(stat -c '%s' /tmp/dbnf-guide.pdf)" = "$GUIDE_SIZE"
          echo "$GUIDE_SHA256  /tmp/dbnf-guide.pdf" | sha256sum --check --strict
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/dbnf-guide.pdf').read_bytes()
          if not data.startswith(b'%PDF-'):
              raise RuntimeError('Transport is not a PDF')
          if b'Red River Gorge Hiker' not in data and b'RedRiverGorgeHiker.com' not in data:
              print('PDF text is compressed; binary signature/hash validation is authoritative.')
          print('Vetted DBNF guide transport validated.')
          PY

      - name: Install public guide and refine SAR copy
        run: |
          set -euo pipefail
          mkdir -p public/downloads
          cp /tmp/dbnf-guide.pdf public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf
          python3 - <<'PY'
          from pathlib import Path

          page_path = Path('src/pages/search-and-rescue.astro')
          text = page_path.read_text()
          replacements = [
              (
                  'Its publicly described capabilities include wilderness searches, high-angle rope rescue, swift-water rescue, and dive/recovery work.',
                  'Its capabilities include wilderness searches, high-angle rope rescue, swift-water rescue, and dive/recovery work.',
              ),
              (
                  'The current Forest Service camping restriction for the Red River Gorge Geological Area says that, except at designated sites, camping is prohibited within <strong>300 feet of any developed road or trail</strong> and within <strong>600 feet of Gray’s Arch</strong>.',
                  'The controlling Forest Service information for the Red River Gorge Geological Area says that, except at designated sites, camping is prohibited within <strong>300 feet of any developed road or trail</strong> and within <strong>600 feet of Gray’s Arch</strong>.',
              ),
              (
                  '<a class="sar-button sar-button-orange" href={sarLinks.forestServiceAlerts} target="_blank" rel="noopener noreferrer">Check current Forest Service rules before your trip ↗</a>',
                  '<a class="sar-button sar-button-orange" href={`${base}downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf`} download>Download 2026 DBNF dispersed camping guide ↓</a>',
              ),
              (
                  'This launch version deliberately links to authoritative sources instead of pretending to maintain a second set of live closure, weather, or road data.',
                  'This site deliberately links to authoritative sources instead of pretending to maintain a second set of live closure, weather, or road data.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Expected exactly one source match, found {count}: {old[:80]}')
              text = text.replace(old, new)
          page_path.write_text(text)

          tests_path = Path('tests/test_site_contract.py')
          tests = tests_path.read_text()
          marker = '    def test_routes(self):\n'
          if marker not in tests:
              raise RuntimeError('Could not locate test insertion point')
          block = '''    def test_sar_camping_guide_download_and_copy(self):\n        sar_page = (ROOT / 'src/pages/search-and-rescue.astro').read_text()\n        guide = ROOT / 'public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf'\n        self.assertTrue(guide.exists())\n        self.assertGreater(guide.stat().st_size, 12_000_000)\n        self.assertIn('Its capabilities include wilderness searches', sar_page)\n        self.assertNotIn('publicly described capabilities', sar_page)\n        self.assertIn('The controlling Forest Service information for the Red River Gorge Geological Area says that', sar_page)\n        self.assertIn('Download 2026 DBNF dispersed camping guide', sar_page)\n        self.assertIn('downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf', sar_page)\n        self.assertNotIn('Check current Forest Service rules before your trip', sar_page)\n        self.assertIn('This site deliberately links to authoritative sources', sar_page)\n        self.assertNotIn('This launch version deliberately links', sar_page)\n\n'''
          if 'def test_sar_camping_guide_download_and_copy' in tests:
              raise RuntimeError('SAR guide regression test already exists')
          tests_path.write_text(tests.replace(marker, block + marker, 1))
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full website checks
        run: npm run check

      - name: Stage only approved SAR refinement and importer cleanup
        run: |
          set -euo pipefail
          git add src/pages/search-and-rescue.astro tests/test_site_contract.py public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf
          git rm .github/workflows/import-dbnf-guide-and-refine-sar.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/import-dbnf-guide-and-refine-sar.yml',
              'src/pages/search-and-rescue.astro',
              'tests/test_site_contract.py',
              'public/downloads/red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise RuntimeError(f'Unexpected staged paths: {sorted(actual ^ expected)}')
          print('Staged change set is limited to the approved SAR refinement, vetted guide, test, and workflow cleanup.')
          PY

      - name: Commit tested staging refinement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine SAR camping guide and resource copy"
          git push origin HEAD:feature/gear-20-card-refresh
