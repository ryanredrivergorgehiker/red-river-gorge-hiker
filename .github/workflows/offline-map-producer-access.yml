name: RRGH one authorized private recovery drill
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: execute one owner-authorized five-cent recovery drill 20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline allowance check before Google authentication
        run: python backend/scripts/drill_gorge_checkpoint.py --phase plan > /dev/null
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Claim reserved slot and stage private checkpoint pack
        run: python backend/scripts/drill_gorge_checkpoint.py --phase stage
  independent-recovery:
    needs: bounded-stage
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fresh checkout without persistent cache or artifacts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline allowance check before independent authentication
        run: python backend/scripts/drill_gorge_checkpoint.py --phase plan > /dev/null
      - name: Reauthenticate existing restricted identity on fresh runner
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Claim recovery slot and verify exact-generation selected ranges
        run: python backend/scripts/drill_gorge_checkpoint.py --phase recovery
# No workflow_dispatch, automatic retry, artifacts, Actions cache, raster work,
# source download, package replacement, IAM, bucket settings, deletion or deployment.
