name: RRGH final approved overview and independent recovery
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: execute approved final terrain overview 20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      final_overview_complete: ${{ steps.producer.outputs.final_overview_complete }}
    steps:
      - name: Checkout exact reviewed stage source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 93419c8c2d464fdf601d9c502aac9f4501f6b93e
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_final_overview.py --phase plan
      - name: Install pinned processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Verify closed history and recover four children for final overview
        id: producer
        run: python backend/scripts/gorge_final_overview.py --phase produce
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.final_overview_complete == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fresh checkout of exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: 93419c8c2d464fdf601d9c502aac9f4501f6b93e
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify unchanged finite recovery allocation
        run: python backend/scripts/gorge_final_overview.py --phase plan
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Reauthenticate the same restricted identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Verify exact-generation cache and output recovery on fresh runner
        run: python backend/scripts/gorge_final_overview.py --phase recovery
# No dispatch, rerun, artifacts, Actions cache, deployment, IAM, bucket change or package replacement.
