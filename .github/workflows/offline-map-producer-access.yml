name: RRGH bounded source-local map campaign and independent recovery
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: execute verified new-territory wave011 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: b32cbc4eece99f930b39df76eadc6328703e2f1c
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Recover accepted inputs and execute up to 128 finite jobs
        id: producer
        run: python backend/scripts/gorge_campaign.py --phase produce
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.worker_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fresh checkout of exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: b32cbc4eece99f930b39df76eadc6328703e2f1c
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify unchanged finite recovery allocation
        run: python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate the same restricted identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently recover and verify every new output and checkpoint
        run: python backend/scripts/gorge_campaign.py --phase recovery
  wave011-readonly-checkpoint-audit:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: verify Wave011 neighbor edges and local package read-only 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Wave011 immutable production source
        uses: actions/checkout@v4
        with:
          ref: b32cbc4eece99f930b39df76eadc6328703e2f1c
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned map validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Authenticate existing restricted keyless identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Inspect immutable failed-wave checkpoints with zero GCS writes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys,tempfile
          from dataclasses import asdict
          from pathlib import Path
          sys.path.insert(0,'backend/scripts')
          from gorge_checkpoint import GCS,Ref,Meter,DIMENSIONS,canonical,digest,decode_record
          from gorge_campaign import configuration,load_large,check_states
          from gorge_second_stage import record,recover_catalogs
          from gorge_stage_coordinator import verify_outputs
          from run_gorge_checkpoint_slot import token
          plan,env,region=configuration()
          expected='03edea40b63ad8d937064e10f7b221445a55da1fa87f7689657a70efab3d96eb'
          assert digest(canonical(plan))==expected and plan['campaign']['sequence']==11
          assert plan['campaign']['carry']['priorCompletedJobs']==1146
          assert plan['campaign']['carry']['priorRasterTiles']==11362
          assert len(plan['approvedJobIDs'])==128
          # One short-lived WIF exchange for this bounded fresh runner; never log it.
          bearer=token()
          class ReadOnlyGCS(GCS):
              def create(self,*a,**k):raise RuntimeError('All GCS creates prohibited in incident audit')
              def _request(self,method,*args,**kwargs):
                  if method!='GET':raise RuntimeError('Non-GET GCS call prohibited')
                  return super()._request(method,*args,**kwargs)
          storage=ReadOnlyGCS(plan,env,lambda:bearer)
          caps=dict.fromkeys(DIMENSIONS,0)
          caps.update(seconds=900,classBRequests=650,egressBytes=256*2**20)
          class ReadOnlySlot:
              def __init__(self):
                  self.meter=Meter(caps)
              def get(self,ref,start=0,length=None,expected_sha256=None):
                  length=ref.bytes if length is None else length
                  self.meter.reserve(classBRequests=1,egressBytes=length+1)
                  raw=storage.read(ref,start,length)
                  if expected_sha256 is not None and digest(raw)!=expected_sha256:
                      raise ValueError('Selected read-only member SHA mismatch')
                  return raw
          slot=ReadOnlySlot()
          prod=Ref(key='engineering/map-production/plans/'+expected+
                   '/slots/00001/receipt.json',
                   generation='1793401709392186',bytes=728,
                   sha256='eaf01977e64789af249b51e12046a6007613ace8523271716fc8921455d0920c')
          producer=decode_record(slot.get(prod))
          assert producer['planSHA256']==expected and producer['slot']==1
          assert producer['result']['status']=='failed' and producer['result']['jobs']==64
          details=load_large(slot,producer['result']['detailRef'])
          assert len(details['completedJobReceipts'])==64 and details['sourcePixelGapJobs']==[]
          records=[record(slot,r,'rrgh-checkpoint-job-v1') for r in details['completedJobReceipts']]
          jobs=[r['job'] for r in records]
          assert len(jobs)==len(set(jobs))==64 and set(jobs)==set(plan['approvedJobIDs'][:64])
          assert all(j.startswith('usgs-topo-16-') and r['slot']==1 and r['planSHA256']==expected
                     for j,r in zip(jobs,records))
          catalog=[c for r in records for c in r['result']['outputPacks']]
          paths=[e['path'] for c in catalog for e in c['members']]
          assert len(paths)==len(set(paths)) and paths
          root=Path(tempfile.mkdtemp(prefix='rrgh-wave011-readonly-'))
          recover_catalogs(slot,catalog,paths,root/'outputs')
          # Discover the exact bootstrap reference via producer detail only when
          # stored evidence contains it; otherwise perform new-tile QA without
          # inventing bootstrap metadata or declaring seam-complete recovery.
          boot=Ref(key='engineering/map-production/plans/'+expected+'/slots/00000/receipt.json',
                   generation='1793401291750355',bytes=622,
                   sha256='ddf341a8a99175c0f9ed6b6901359dc0baf6c709834dc8c5fde0893d20ebabea')
          initial_receipt=decode_record(slot.get(boot))
          assert initial_receipt['planSHA256']==expected and initial_receipt['slot']==0
          assert initial_receipt['result']['status']=='ready'
          initial=load_large(slot,initial_receipt['result']['bootstrapDataRef'])
          neighbors=initial['neighbors']
          oldpaths=[e['path'] for c in neighbors for e in c['members']]
          assert len(oldpaths)==len(set(oldpaths))
          if oldpaths:
              recover_catalogs(slot,neighbors,oldpaths,root/'old')
          qa=verify_outputs(plan,region,records,root/'outputs',root/'old')
          assert qa['jobs']==64 and qa['files']==64 and qa['pixelsDecoded']
          # Build native intermediate parts ONLY in the isolated runner's local
          # filesystem: no GCS writes and no public package deployment.
          from build_gorge_map_bundles import PROFILE,partition,write_part
          groups={g:[] for g in PROFILE}
          for result_record in records:
              for e in result_record['result']['originalReceipt']['outputs']:
                  fields=e['path'].split('/')
                  layer=fields[1]
                  group=next(g for g,ls in PROFILE.items() if layer in ls)
                  groups[group].append({**e,'source':str(root/'outputs'/e['path']),
                                       'layer':layer,'z':int(fields[2]),'x':int(fields[3]),
                                       'y':int(Path(fields[4]).stem)})
          local_parts=[]
          for group,entries in groups.items():
              if not entries:continue
              folder=root/'parts'/group
              folder.mkdir(parents=True,exist_ok=True)
              for items in partition(group,entries):
                  item=write_part(group,items,folder)
                  part_path=folder/item['file']
                  assert part_path.stat().st_size==item['byteCount']
                  assert item['byteCount']<=256000000 and item['fileCount']<=60000
                  local_parts.append({'group':group,'byteCount':item['byteCount'],
                                      'fileCount':item['fileCount'],'sha256':digest(part_path.read_bytes())})
          assert local_parts and sum(p['fileCount'] for p in local_parts)>=64
          (root/'state').mkdir(mode=0o700)
          states=check_states(load_large(slot,details['stateRef']),root/'state')
          assert states['hashesAndSQLiteVerified']
          result={'status':'read-only-partial-qa-verified-not-accepted',
                  'checkedJobs':qa['jobs'],'newOutputTiles':qa['files'],
                  'newTileHashesPixelsVerified':True,
                  'newAndPriorAdjacentEdges':qa['adjacentEdgesMeasured'],
                  'priorNeighborEdgesChecked':True,
                  'neighborFilesRecovered':len(oldpaths),
                  'localPackagePartsVerified':local_parts,
                  'nativePackagingNotStoredOrPublished':True,
                  'historicalInventoryUnchanged':{'jobs':1146,'tiles':11362,'sunlight':320},
                  'sourcePixelGaps':0,'quarantinedHistoricalAttempts':19,
                  'gcsWrites':0,'gcsReadRequests':slot.meter.used['classBRequests'],
                  'gcsReservedEgressBytes':slot.meter.used['egressBytes'],
                  'stateLedgersVerified':states['ledgers'],
                  'wave011ProducerReceipt':asdict(prod)}
          print(json.dumps(result,sort_keys=True),flush=True)
          PY
# Wave011 READ-ONLY forensic audit is isolated from producer/recovery spending jobs by exact commit-message guard.
# Wave011: 128 new topo-first / leaf-on source-backed jobs, 1408 planned tiles. Exact Wave010 recovered carry (1146 jobs / 11362 tiles), 19 consumed attempts excluded; separate fresh-runner recovery, USD25 ceiling. Exactly pinned verified source and quarantine protections.
# Existing keyless identity; no artifacts, raw source uploads, reruns, deployment or security changes.

# Separate zero-source-job Wave011 salvage; original producer/recovery gates remain unchanged.

  wave011-salvage-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: recover verified Wave011 checkpoints without rerendering 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout separately verified immutable recovery-only plan
        uses: actions/checkout@v4
        with:
          ref: c86eaace181a9c0107725344d506334b899ba7c7
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify no source jobs or over-budget writes before authentication
        run: python backend/scripts/gorge_wave011_salvage.py --phase plan
      - name: Authenticate established restricted keyless identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Save two rebuilt package parts in a NEW paid slot, then read back
        run: python backend/scripts/gorge_wave011_salvage.py --phase stage

  wave011-salvage-independent:
    needs: wave011-salvage-stage
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: recover verified Wave011 checkpoints without rerendering 20261030' &&
      needs.wave011-salvage-stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fresh independent checkout of same pinned recovery-only plan
        uses: actions/checkout@v4
        with:
          ref: c86eaace181a9c0107725344d506334b899ba7c7
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Re-verify same immutable allocation with no producer retry
        run: python backend/scripts/gorge_wave011_salvage.py --phase plan
      - name: Authenticate established restricted keyless identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently recover source records and read back every new part
        run: python backend/scripts/gorge_wave011_salvage.py --phase independent
