name: RRGH audited stage continuation and independent recovery
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: execute measured indexed twelve-job continuation 20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - name: Checkout exact reviewed stage source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: c08b81945f8f34945ab936fb957e9669e5c43224
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_stage_coordinator.py --phase plan
      - name: Receive exact private seed without exposing references
        env:
          RRGH_STAGE_SEED_TRANSFER: ${{ secrets.RRGH_STAGE_SEED_TRANSFER }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/rrgh-private"
          python backend/scripts/fetch_gorge_private_seed.py --destination "$RUNNER_TEMP/rrgh-private/seed.zip"
      - name: Install pinned processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Reuse measured private Base index, verify genuine inputs and run original twelve jobs
        id: producer
        run: python backend/scripts/gorge_stage_coordinator.py --phase stage
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.worker_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fresh checkout of exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: c08b81945f8f34945ab936fb957e9669e5c43224
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify unchanged finite recovery allocation
        run: python backend/scripts/gorge_stage_coordinator.py --phase plan
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Reauthenticate the same restricted identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Verify exact-generation cache and output recovery on fresh runner
        run: python backend/scripts/gorge_stage_coordinator.py --phase recovery
# No dispatch, rerun, artifacts, Actions cache, deployment, IAM, bucket change or package replacement.
