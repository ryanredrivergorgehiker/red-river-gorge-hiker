name: RRGH reconcile the reserved private input gate
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  reserved-reconciliation:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: reconcile reserved input gate without raster retry 20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0a00243b0a931a54e5f1eb5f152113f154c896c
          persist-credentials: false
      - name: Verify original stage allocation
        run: python3 backend/scripts/gorge_stage_coordinator.py --phase plan
      - uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Use only the previously unused recovery slot for bounded receipt and Base inspection
        env:
          PYTHONPATH: backend/scripts
        run: |
          python3 - <<'PY'
          import json, tarfile, io, base64, hashlib, re
          from dataclasses import asdict
          from urllib.parse import quote, urlencode
          from urllib.request import Request
          from gorge_checkpoint import GCS, Slot, canonical, BUCKET, MAX_METADATA
          from gorge_stage_coordinator import configuration, CountedOpener, token
          from gorge_stage_preflight import BASE_KEY, BASE_BYTES, BASE_SHA
          from fetch_gorge_private_seed import CONTEXT
          import os
          if any(os.environ.get(k)!=v for k,v in CONTEXT.items()): raise ValueError('Workflow context')
          plan,evidence,region=configuration()
          opener=CountedOpener();store=GCS(plan,evidence,token,opener)
          slot=Slot(store,plan,2,os.environ['GITHUB_RUN_ID']);opener.deadline=slot.meter.deadline
          ref,receipt=slot.recover_receipt(0)
          result={'priorBootstrapReceipt':asdict(ref),'priorBootstrap':receipt['result'],'rasterAttempts':0}
          endpoint='https://storage.googleapis.com/storage/v1/b/'+BUCKET+'/o/'+quote(BASE_KEY,safe='')
          def request(url,maximum,headers=None):
           slot.meter.reserve(classBRequests=1,egressBytes=maximum+1)
           req=Request(url,headers={'Authorization':'Bearer '+token(),'Accept-Encoding':'identity',**(headers or {})})
           with opener(req,timeout=60) as r:
            raw=r.read(maximum+1)
            if len(raw)>maximum or r.geturl()!=url:raise ValueError('Bounded response')
            return raw,{k.lower():v for k,v in r.headers.items()},r.status
          meta=json.loads(request(endpoint,MAX_METADATA)[0])
          size=int(meta['size']);generation=str(meta['generation'])
          if meta['bucket']!=BUCKET or meta['name']!=BASE_KEY or not re.fullmatch('[1-9][0-9]*',generation):raise ValueError('Base metadata')
          result['baseMetadata']={'bytes':size,'expectedBytes':BASE_BYTES,'generation':generation,'md5Hash':meta.get('md5Hash'),'crc32c':meta.get('crc32c')}
          url=endpoint+'?'+urlencode({'alt':'media','generation':generation,'ifGenerationMatch':generation})
          windows=[(0,min(size,65536)),(max(0,size-2*2**20),min(size,2*2**20))]
          manifests=[]
          for start,length in windows:
           raw,h,status=request(url,length,{'Range':f'bytes={start}-{start+length-1}'})
           if status!=206 or len(raw)!=length or h.get('x-goog-generation')!=generation:raise ValueError('Base range identity')
           if h.get('content-range')!=f'bytes {start}-{start+length-1}/{size}':raise ValueError('Base range extent')
           for local in range((-start)%512,len(raw)-512+1,512):
            block=raw[local:local+512]
            try:info=tarfile.TarInfo.frombuf(block,'utf-8','strict')
            except (tarfile.TarError,ValueError,UnicodeError):continue
            if info.name in ('NATIVE-MAP.json','PACKAGE-MANIFEST.json','MANIFEST.json'):
             data_offset=start+local+512
             if not info.isfile() or not 0<info.size<=4*2**20:raise ValueError('Manifest bound')
             if local+512+info.size<=len(raw):body=raw[local+512:local+512+info.size]
             else:
              body,hh,ss=request(url,info.size,{'Range':f'bytes={data_offset}-{data_offset+info.size-1}'})
              if ss!=206 or hh.get('x-goog-generation')!=generation or len(body)!=info.size:raise ValueError('Manifest range')
             m=json.loads(body)
             manifests.append({'name':info.name,'bytes':info.size,'sha256':hashlib.sha256(body).hexdigest(),'offset':data_offset,
               'schemaVersion':m.get('schemaVersion'),'packageID':m.get('packageID'),'packageVersion':m.get('packageVersion'),
               'keys':list(m),'vectorIDs':[v.get('id') for v in m.get('vectors',[])],
               'weatherPresent':bool(m.get('weatherManifest')),'staticAssetCount':len(m.get('staticAssets',[]))})
          result['manifestMetadata']=manifests;result['gcsBeforeFinalReceipt']=opener.summary()
          out=slot.finish(result)
          print(json.dumps({'reconciliation':result,'reconciliationRef':asdict(out),'gcsIncludingFinalReceipt':opener.summary()},sort_keys=True))
          PY
# No seed upload, source request, raster attempt, retry, artifact or deployment.
