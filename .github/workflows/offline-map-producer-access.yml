name: RRGH private accepted Base member inventory
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: inventory accepted Base members within stage budget 20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reviewed stage source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 358b586d8da1d412179d764b26dbec3c92e22b5b
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_stage_coordinator.py --phase plan
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Inventory exact accepted Base headers and manifest, preserve private reusable index
        id: producer
        run: python backend/scripts/gorge_stage_coordinator.py --phase inventory
# Metadata inventory only: no seed transfer, raster work, IAM changes, artifacts or deployment.
