name: RRGH second bounded map stage and independent recovery
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: continue second approved adjacent stage after dependency-proof correction 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 339cf15b598e389f9b3d26f34be076599304f6f3
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_second_stage.py --phase plan
      - name: Install pinned processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Recover accepted inputs and execute exactly twelve new jobs
        id: producer
        run: python backend/scripts/gorge_second_stage.py --phase produce
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.worker_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fresh checkout of exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: 339cf15b598e389f9b3d26f34be076599304f6f3
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify unchanged finite recovery allocation
        run: python backend/scripts/gorge_second_stage.py --phase plan
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Authenticate the same restricted identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently recover and verify every new output and checkpoint
        run: python backend/scripts/gorge_second_stage.py --phase recovery
# Two sequential jobs, maximum 170 minutes plus retained 10-minute old slot; no artifacts, cache, dispatch,
# automatic rerun, secret, deployment, IAM, bucket change or package replacement.
