name: RRGH bounded source-local map campaign and independent recovery
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/workflows/offline-map-producer-access.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  bounded-stage:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'Lane20: execute verified new-territory wave011 20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    outputs:
      worker_receipt: ${{ steps.producer.outputs.worker_receipt }}
    steps:
      - name: Checkout exact reviewed source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: b32cbc4eece99f930b39df76eadc6328703e2f1c
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned processing dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify finite release and exact source before authentication
        run: python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate existing restricted direct WIF identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Recover accepted inputs and execute up to 128 finite jobs
        id: producer
        run: python backend/scripts/gorge_campaign.py --phase produce
  independent-recovery:
    needs: bounded-stage
    if: >-
      always() && github.run_attempt == 1 &&
      needs.bounded-stage.outputs.worker_receipt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Fresh checkout of exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: b32cbc4eece99f930b39df76eadc6328703e2f1c
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check -r backend/scripts/requirements-gorge-benchmark.txt
      - name: Verify unchanged finite recovery allocation
        run: python backend/scripts/gorge_campaign.py --phase plan
      - name: Authenticate the same restricted identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rrgh-nonproduction
          workload_identity_provider: projects/843975209563/locations/global/workloadIdentityPools/rrgh-map-production/providers/github-map-build
          create_credentials_file: true
          export_environment_variables: true
      - name: Set up existing Cloud SDK access
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: rrgh-nonproduction
      - name: Independently recover and verify every new output and checkpoint
        run: python backend/scripts/gorge_campaign.py --phase recovery
# Wave011: 128 new topo-first / leaf-on source-backed jobs, 1408 planned tiles. Exact Wave010 recovered carry (1146 jobs / 11362 tiles), 19 consumed attempts excluded; separate fresh-runner recovery, USD25 ceiling. Exactly pinned verified source and quarantine protections.
# Existing keyless identity; no artifacts, raw source uploads, reruns, deployment or security changes.
