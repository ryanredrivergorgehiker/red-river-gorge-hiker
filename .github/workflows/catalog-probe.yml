name: Pinterest Catalog Stage 1 UAT

on:
  push:
    branches:
      - catalog-stage1-automation-20260909

permissions:
  contents: read

jobs:
  catalog-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate controlled Stage 1 feed
        run: node scripts/generate-pinterest-art-catalog.mjs --output-dir catalog-uat

      - name: Verify exact row count and required columns
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const csv = fs.readFileSync('catalog-uat/pinterest-art-catalog.csv', 'utf8').trimEnd().split(/\r?\n/);
          if (csv.length !== 47) throw new Error(`Expected header + 46 rows, found ${csv.length} lines`);
          const expected = '"id","title","description","link","image_link","price","availability","product_type","alt_text"';
          if (csv[0] !== expected) throw new Error(`Unexpected header: ${csv[0]}`);
          const manifest = JSON.parse(fs.readFileSync('catalog-uat/pinterest-art-catalog-manifest.json', 'utf8'));
          if (manifest.itemCount !== 46 || manifest.rows.length !== 46) throw new Error('Manifest count mismatch');
          if (!manifest.noGear || manifest.paidCampaignChanged) throw new Error('Stage 1 boundary violation');
          console.log('UAT PASS: 46 rows, no Gear, no paid-campaign change.');
          console.log('PRICE RANGE', Math.min(...manifest.rows.map(r => Number(r.price.split(' ')[0]))), Math.max(...manifest.rows.map(r => Number(r.price.split(' ')[0]))));
          NODE

      - name: Upload UAT feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-art-catalog-stage1-uat
          path: catalog-uat/
          if-no-files-found: error
