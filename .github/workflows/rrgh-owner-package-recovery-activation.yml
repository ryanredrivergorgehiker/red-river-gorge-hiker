name: RRGH owner-only one-time package recovery activation
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths:
      - .github/automation/rrgh-package-owner-approval-20261117.json
permissions:
  contents: read
concurrency:
  group: rrgh-controller-initial-launch
  cancel-in-progress: false
jobs:
  owner-one-time-package-recovery:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.ref == 'refs/heads/lane20/offline-production-preflight-20261029' &&
      github.event_name == 'push' &&
      github.actor == 'ryanredrivergorgehiker' &&
      github.triggering_actor == 'ryanredrivergorgehiker' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.github/automation:accepted-source/backend/scripts'
    steps:
      - name: Fetch the exact owner-approved private controller commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin original approved raster source; do not regenerate images
        uses: actions/checkout@v4
        with:
          ref: d17d0e335ac47e1f6d116e149992cc02d6e4a827
          path: accepted-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install historical package-planning dependencies without a token or Cloud SDK
        run: python -m pip install --disable-pip-version-check -r accepted-source/backend/scripts/requirements-gorge-benchmark.txt
      - name: Deny unreviewed push provenance and absent owner approval WITHOUT a token
        run: python .github/automation/rrgh_owner_package_activation_runner_20261117.py --preflight-event
      - name: Once-only exact GitHub CAS followed by at most one bounded package workflow dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_owner_package_activation_runner_20261117.py --execute
# Not workflow_dispatch: that would require publishing a new activation workflow
# on the public website default branch. This private-branch workflow is inert
# until a separately authorized, exactly pinned approval JSON file is added by
# the actual GitHub owner as the sole changed file in one new push commit.
# NO id-token:write, NO Google Cloud credentials, NO re-run and NO auto-retry.
