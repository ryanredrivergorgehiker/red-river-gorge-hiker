name: RRGH consumed recovery completion offline QA
on:
  push:
    branches: [lane20/wave289-completion-20261104]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 3ed911830fc2a1d69d8c3f30e457068ca2ca78ab
          path: completion-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r completion-source/backend/scripts/requirements-gorge-benchmark.txt
      - name: Consumed allocation, source-free completion, accounting, duplicate-claim and proof mutation tests
        env:
          RRGH_TEST_SOURCE: completion-source
        run: python -m unittest discover -s .github/automation -p test_rrgh_completion.py -v
      - name: Existing single-owner dispatch, read-only retries, split-recovery and batch preservation regressions
        env:
          RRGH_TEST_SOURCE: completion-source
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_dispatcher.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_pre_admission.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_active_run_inventory.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_recovery_only.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_resumable_pairs.py -v
      - name: Exact source289 completion to immutable serial successor without credentials or network work
        run: python .github/automation/verify_rrgh_completion_roundtrip.py completion-source
