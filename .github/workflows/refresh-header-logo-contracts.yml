name: Refresh header logo contracts

on:
  push:
    branches:
      - uat/gear-four-products-20260828
    paths:
      - .github/workflows/refresh-header-logo-contracts.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uat/gear-four-products-20260828
          fetch-depth: 0

      - name: Refresh stale header-logo expectations
        shell: bash
        run: |
          set -euo pipefail
          cat > tests/test_header_brand_logo_contract.py <<'PY'
          import hashlib
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).parents[1]
          HEADER = (ROOT / 'src/components/Header.astro').read_text()
          AVIF = ROOT / 'public/assets/brand/rrgh-banner-logo-profile-transparent-v3.avif'
          WEBP = ROOT / 'public/assets/brand/rrgh-banner-logo-profile-transparent-v3.webp'
          SUPERSEDED = ROOT / 'public/assets/brand/rrgh-banner-logo-profile-pixels-v3.png'

          class HeaderBrandLogoContract(unittest.TestCase):
              def test_header_uses_approved_v3_assets(self):
                  self.assertIn("const bannerAvifFilename = 'rrgh-banner-logo-profile-transparent-v3.avif';", HEADER)
                  self.assertIn("const bannerWebpFilename = 'rrgh-banner-logo-profile-transparent-v3.webp';", HEADER)
                  self.assertIn('type="image/avif"', HEADER)
                  self.assertIn('width="2048"', HEADER)
                  self.assertIn('height="682"', HEADER)
                  self.assertNotIn('rrgh-banner-logo-profile-pixels-v3.png', HEADER)
                  self.assertNotIn('rrgh-banner-logo-profile-v2.svg', HEADER)

              def test_approved_transparent_assets_are_present_and_exact(self):
                  self.assertTrue(AVIF.exists())
                  self.assertTrue(WEBP.exists())
                  self.assertEqual(
                      hashlib.sha256(AVIF.read_bytes()).hexdigest(),
                      '5a4ca76f10f6462abecf8e33ac00c8e2b6ad8f18b3e7289a9ec3d31284da1578'
                  )
                  self.assertEqual(
                      hashlib.sha256(WEBP.read_bytes()).hexdigest(),
                      '723188929fd868e3c6e6c82a966769c398fc07044231b65c5a0ff8c5fbed9aaf'
                  )
                  self.assertFalse(SUPERSEDED.exists())
                  self.assertFalse((ROOT / 'public/assets/brand/RRGH_Banner_Logo_Profile_Transparent_PIXELS_V3.png').exists())

          if __name__ == '__main__':
              unittest.main()
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_site_contract.py')
          text = path.read_text()
          old = "        self.assertIn('rrgh-banner-logo-profile-pixels-v3.png', header)"
          new = "        self.assertIn('rrgh-banner-logo-profile-transparent-v3.avif', header)\n        self.assertIn('rrgh-banner-logo-profile-transparent-v3.webp', header)\n        self.assertNotIn('rrgh-banner-logo-profile-pixels-v3.png', header)"
          if old not in text:
              raise SystemExit('stale navigation header assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify repository contract suite
        run: python3 -m unittest discover -s tests -p 'test*.py' -v

      - name: Commit corrections and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add tests/test_header_brand_logo_contract.py tests/test_site_contract.py
          git rm .github/workflows/refresh-header-logo-contracts.yml
          git commit -m 'Update header logo contracts for approved V3 assets'
          git push origin HEAD:uat/gear-four-products-20260828
