name: RRGH native repair pilot QA
on:
  push:
    branches: [lane20/native-repair-pilot-20261110]
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RRGH_TEST_SOURCE: source-checkout
jobs:
  repair-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 895c01953481b2b5825abee9a4c0681f37211eb4
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Exact wave1418 through second-attempt repair and safe settled hold
        run: python .github/automation/verify_rrgh_native_repair_roundtrip.py source-checkout
      - name: Preserve existing handoff, publication and completion paths
        run: |
          python -m unittest discover -s .github/automation -p test_rrgh_native_repair.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_handoff.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_published_successor.py -v
          python -m unittest discover -s .github/automation -p test_rrgh_completion_throughput.py -v
      - name: Retain native full-pixel and global attempt guards
        working-directory: source-checkout/backend/scripts
        run: |
          python -m unittest test_gorge_checkpoint test_gorge_source_gap_guard -v
