name: Refresh OSM local roads cache

on:
  workflow_dispatch:
  schedule:
    - cron: '41 9 * * 1'
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - 'scripts/update_osm_local_roads.py'
      - '.github/workflows/refresh-osm-local-roads.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install spatial cache dependencies
        run: python -m pip install --disable-pip-version-check shapely
      - name: Refresh cached OpenStreetMap local roads
        run: python scripts/update_osm_local_roads.py
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/map/osm-local-roads public/data/map/osm-local-roads-manifest.json public/data/map/osm-local-roads.geojson
          if git diff --cached --quiet; then
            echo "OSM local-road cache unchanged."
          else
            git commit -m "Refresh cached OSM local roads [skip ci]"
            git push
          fi
