name: RRGH forward-only Wave023 synthetic offline end-to-end QA
on:
  push:
    branches: [lane20/unattended-supervisor-20261031]
    paths:
      - .github/workflows/rrgh-wave023-offline-qa.yml
      - .github/automation/rrgh_prepare_push_successor_v2.py
      - .github/automation/rrgh_publish_push_successor_v2.py
      - .github/automation/rrgh_map_supervisor_v2.py
      - .github/automation/test_rrgh_source_pixel_gap.py
      - .github/automation/rrgh_remaining_source_assessment.py
permissions:
  contents: read
jobs:
  test-local-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2ff6abcc084b578c75cf0dedbfa63ccf3b6b535a
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked source-window builder dependencies
        run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Produce EXPLICITLY SYNTHETIC receipt for offline successor-policy tests only
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,json,sys,zlib
          from pathlib import Path
          sys.path.insert(0,'source-checkout/backend/scripts')
          from gorge_checkpoint import canonical,digest
          root=Path('source-checkout/backend/config/gorge-campaign-wave-022-push-20261031')
          p=json.loads((root/'PLAN.json').read_bytes())
          region=json.loads(zlib.decompress(base64.b64decode((root/'REGION-PLAN.json.z.b64').read_bytes())))
          plan_sha=digest(canonical(p))
          ref={'key':f'engineering/map-production/plans/{plan_sha}/slots/00002/receipt.json',
               'generation':'1','bytes':1536,'sha256':'c'*64}
          report={'verified':True,'dispatchAuthorized':False,'wave':22,
             'acceptedJobs':len(p['completedJobIDs'])+len(p['approvedJobIDs']),
             'acceptedRasterTiles':p['campaign']['carry']['priorRasterTiles']+sum(len(j['outputTiles']) for j in region['jobs']),
             'historicalExclusions':45,'sunlightAssets':320,
              'partialRecovered':False,'partialCompletedJobIDs':[],'failedJobID':None,
             'planSHA256':plan_sha,'receiptRef':ref,'receiptSHA256':ref['sha256'],
             'nextCarry':{'chargedUSD':'8.00','storedBytes':16300000000,
                          'priorCompletedJobs':len(p['completedJobIDs'])+len(p['approvedJobIDs']),
                          'priorRasterTiles':p['campaign']['carry']['priorRasterTiles']+sum(len(j['outputTiles']) for j in region['jobs']),
                          'priorSunlightAssets':320}}
          Path('/tmp/rrgh-synthetic-never-publish.json').write_text(json.dumps(report))
          print('SYNTHETIC ONLY: no valid GCS generation/receipt; publisher not authorized')
          PY
      - name: Fully simulate strict forward-only USD125/USD2 Wave023 source migration OFFLINE
        run: |
          python .github/automation/rrgh_prepare_push_successor_v2.py source-checkout /tmp/rrgh-synthetic-never-publish.json
          python source-checkout/backend/scripts/gorge_campaign.py --phase plan
          python3 - <<'PY'
          from pathlib import Path
          code=Path('source-checkout/backend/scripts/gorge_campaign.py').read_text()
          budget=Path('source-checkout/backend/scripts/gorge_campaign_budget.py').read_text()
          assert "c['ceilingUSD']" in code, 'New campaign fence source was not migrated'
          assert 'gorge-full-quality-125usd-20261031' in budget, 'New budget source not installed'
          assert Path('source-checkout/backend/config/gorge-campaign-wave-022-push-20261031/PLAN.json').is_file()
          assert Path('source-checkout/backend/config/gorge-campaign-wave-023-20261031/PLAN.json').is_file()
          print('SYNTHETIC_MIGRATION_FILES_VERIFIED: old plan intact, new exact budget and fence')
          PY
          echo "SYNTHETIC_FORWARD_ONLY_POLICY_MIGRATION_QA_PASS: ZERO GITHUB WRITES, ZERO CLOUD CALLS"
      - name: Verify GitHub source lease, budget plan and atomic publication preconditions — READ ONLY
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          output=$(python .github/automation/rrgh_publish_push_successor_v2.py source-checkout /tmp/rrgh-synthetic-never-publish.json 2>&1)
          status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo 'PUBLISHER_READ_ONLY_SMOKE_PASS: current source lease valid; no writes'
          else
            # The historical Wave022 fixture is intentionally stale after
            # real Wave023+ publication. Only exact CAS rejection is success.
            echo "$output" | grep -Fq 'PUBLISHER_STOP: Source branch changed; compare-and-swap stop'
            echo 'PUBLISHER_STALE_LEASE_REJECTION_PASS: no writes or Cloud requests'
          fi

      - name: Checkout separate untouched Wave036 source for actual layer assessment
        uses: actions/checkout@v4
        with:
          ref: 8e50dc0f42a7cf2089dc5c7f740fdce01dd66243
          path: assessment-checkout
          persist-credentials: false
      - name: Inspect exact Wave036 remaining source-backed layer opportunities without Cloud access
        run: python .github/automation/rrgh_remaining_source_assessment.py assessment-checkout
      - name: Test exact verified Wave037 source-gap receipt accounting (no Cloud)
        run: python -m unittest discover -s .github/automation -p test_rrgh_source_pixel_gap.py -v
      - name: Checkout immutable Wave037 nine-job source plan for successor readback
        uses: actions/checkout@v4
        with:
          ref: 6b6b5ddbad89a7a2086eebcd6178df0146e7200a
          path: wave37-source
          persist-credentials: false
      - name: Verify Wave038 successor from actual-identity Wave037 acceptance fixture OFFLINE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'.github/automation')
          from test_rrgh_source_pixel_gap import RUN,JOBS,REPORT,producer_lines,report_lines
          from rrgh_map_supervisor_v2 import audit_run
          result=audit_run(RUN,JOBS,report_lines(),producer_lines())
          Path('/tmp/rrgh-wave037-gap-verified-qa.json').write_text(json.dumps(result))
          print('SOURCE_GAP_POLICY_FIXTURE_VERIFIED',result['acceptedJobs'],result['acceptedRasterTiles'])
          PY
          python .github/automation/rrgh_prepare_push_successor_v2.py wave37-source /tmp/rrgh-wave037-gap-verified-qa.json
          python wave37-source/backend/scripts/gorge_campaign.py --phase plan
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('wave37-source/backend/config')
          p37=json.loads((root/'gorge-campaign-wave-037-20261031/PLAN.json').read_bytes())
          p38=json.loads((root/'gorge-campaign-wave-038-20261031/PLAN.json').read_bytes())
          old=set(p37['completedJobIDs'])
          accepted=set(p38['completedJobIDs'])
          gaps=set(p38['campaign']['sourcePixelGapQuarantines'])
          assert len(accepted-old)==6 and len(gaps)==3
          assert gaps.isdisjoint(accepted)
          assert len(p38['approvedJobIDs'])>0 and not set(p38['approvedJobIDs'])&gaps
          assert all(p38['priorAttemptCounts'].get(x)==1 for x in p37['approvedJobIDs'])
          print('WAVE038_NEXT_PLAN_PROVED: 6 accepted, 3 excluded, genuine new jobs, no Cloud writes')
          PY
      - name: Dry run source-only publisher against actual production source CAS, no writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python .github/automation/rrgh_publish_push_successor_v2.py wave37-source /tmp/rrgh-wave037-gap-verified-qa.json
