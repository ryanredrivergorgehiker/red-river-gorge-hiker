name: RRGH one-time verified eight-part archive receipt reconciliation
on:
  push:
    branches: [lane20/offline-production-preflight-20261029]
    paths: [.github/automation/rrgh-archive-reconcile-request.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: rrgh-map-producer-auth-preflight
  cancel-in-progress: false
jobs:
  accept-verified-parts:
    if: >-
      github.repository == 'ryanredrivergorgehiker/red-river-gorge-hiker' &&
      github.actor == 'ryanredrivergorgehiker' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d17d0e335ac47e1f6d116e149992cc02d6e4a827
          path: source-checkout
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned source analysis dependencies (no Cloud credentials)
        run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Reconcile already independently verified immutable receipts only; no Cloud or dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/automation/rrgh_archive_receipt_reconcile_20261111.py source-checkout
