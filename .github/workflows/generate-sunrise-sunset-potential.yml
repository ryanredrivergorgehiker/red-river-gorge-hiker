name: Generate sunrise sunset potential

on:
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - scripts/generate-sunrise-sunset-viewshed.py
      - .github/workflows/generate-sunrise-sunset-potential.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunrise-sunset-potential-staging
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          ref: staging/routes-tracks-interactive-map
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install photographic viewshed dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy rasterio pillow requests shapely

      - name: Generate terrain and aerial photographic viewshed overlay
        run: python scripts/generate-sunrise-sunset-viewshed.py

      - name: Commit refreshed derived overlay
        run: |
          if [ -z "$(git status --porcelain -- public/data/map/sunrise-sunset-potential.png public/data/map/sunrise-sunset-potential.svg public/data/map/sunrise-sunset-potential.meta.json)" ]; then
            echo "Derived overlay is already current."
            exit 0
          fi
          git config user.name "ryanredrivergorgehiker"
          git config user.email "ryan@redrivergorgehiker.com"
          git add -A public/data/map/sunrise-sunset-potential.png public/data/map/sunrise-sunset-potential.svg public/data/map/sunrise-sunset-potential.meta.json
          git commit -m "Generate sunrise sunset photographic viewshed"
          git push origin HEAD:staging/routes-tracks-interactive-map
