name: Generate sunrise sunset potential

on:
  push:
    branches:
      - staging/routes-tracks-interactive-map
    paths:
      - scripts/generate-ridge-skeleton-calibration.py
      - .github/workflows/generate-sunrise-sunset-potential.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sunrise-sunset-potential-staging
  cancel-in-progress: true

jobs:
  # Retry marker: topological ridge v10 after transient runner shutdown.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out staging source
        uses: actions/checkout@v4
        with:
          ref: staging/routes-tracks-interactive-map
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install photographic viewshed dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-image rasterio pillow requests shapely

      - name: Generate Pinch-Em-Tight ridge skeleton calibration
        run: python scripts/generate-ridge-skeleton-calibration.py

      - name: Commit refreshed derived overlay
        run: |
          if [ -z "$(git status --porcelain -- public/data/map/sunrise-sunset-calibration-ridge-skeleton.png public/data/map/sunrise-sunset-calibration-crest.png public/data/map/sunrise-sunset-ridge-calibration.meta.json)" ]; then
            echo "Derived overlay is already current."
            exit 0
          fi
          git config user.name "ryanredrivergorgehiker"
          git config user.email "ryan@redrivergorgehiker.com"
          git add -- public/data/map/sunrise-sunset-calibration-ridge-skeleton.png public/data/map/sunrise-sunset-calibration-crest.png public/data/map/sunrise-sunset-ridge-calibration.meta.json
          git commit -m "Generate topological ridge calibration"
          git push origin HEAD:staging/routes-tracks-interactive-map
