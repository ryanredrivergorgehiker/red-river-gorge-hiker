name: RRGH queued package verification recovery QA
on:
  push:
    branches: [lane20/queued-verify-recovery-20261111, lane20/queued-verify-trusted-dispatch-20261111, lane20/verify-in-existing-wif-workflow-20261111, lane20/queued-verify-import-fix-20261111, lane20/verify-eight-part-cap-fix-20261111]
  pull_request:
    branches: [lane20/offline-production-preflight-20261029]
    paths:
      - .github/automation/rrgh_orphan_package_verify_20261111.py
      - .github/automation/test_rrgh_orphan_package_verify_20261111.py
      - .github/workflows/rrgh-final-package-queued-verify.yml
      - .github/workflows/rrgh-queued-verifier-broker.yml
      - .github/workflows/offline-map-restricted-dispatch.yml
      - .github/workflows/rrgh-queued-verify-qa.yml
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Syntax, one-time identity, refusal and immutable state regression tests
        run: |
          python -m py_compile .github/automation/rrgh_orphan_package_verify_20261111.py .github/automation/test_rrgh_orphan_package_verify_20261111.py
          python -m unittest discover -s .github/automation -p 'test_rrgh_orphan_package_verify_20261111.py' -v
      - name: Broker syntax and bounded pre-slot retry proof
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/rrgh-queued-verifier-broker.yml').read_text()
          snippet=text.split("python - <<'PY'",1)[1].split('\n          PY',1)[0]
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in snippet.splitlines())
          compile(code,'exact-owner-broker.py','exec')
          assert 'prepare_code_upgrade(api' not in code
          assert "ModuleNotFoundError: No module named 'gorge_checkpoint'" in code
          assert "correctedSourcePR=132" in code
          assert "actions/workflows/offline-map-restricted-dispatch.yml/dispatches" in code
          print('Owner-only broker code compiles and cannot repeat code cutover')
          PY
      - name: Check out exact accepted raster source for read-only package-plan rehearsal
        uses: actions/checkout@v4
        with:
          ref: d17d0e335ac47e1f6d116e149992cc02d6e4a827
          path: source-checkout
          persist-credentials: false
      - name: Install the already-pinned native source dependencies
        run: python -m pip install --disable-pip-version-check -r source-checkout/backend/scripts/requirements-gorge-benchmark.txt
      - name: Reconstruct EXACT funded ordinal-18 verification plan without Cloud
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'.github/automation')
          from rrgh_orphan_package_verify_20261111 import source_plan_and_funding,PACKAGE_PLAN,CONTROL,NEW_CONTROL
          from rrgh_package_authority import digest
          state=json.loads(Path('.github/automation/rrgh-controller-state.json').read_text())
          assert state['controlDigest']==NEW_CONTROL
          plan,evidence,authority=source_plan_and_funding(Path('source-checkout'),state)
          assert digest(plan)==PACKAGE_PLAN
          assert plan['finalPackagePhase']['controllerDigest']==CONTROL
          assert plan['finalPackagePhase']['operation']==state['package']['operation']
          assert len(plan['finalPackagePhase']['operation']['parts'])==8
          assert plan['slots'][1]['storedBytes']==16*2**20
          assert plan['slots'][1]['sourceRequests']==0 and plan['slots'][1]['sourceBytes']==0
          assert plan['campaign']['ceilingUSD']=='125.00'
          print('EXACT FUNDED 8-PART READBACK PLAN VERIFIED WITHOUT CLOUD OR SLOT CLAIM')
          PY
      - name: Original controller fingerprint must be completely unchanged
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0,'.github/automation')
          from rrgh_dispatcher import local_digest
          actual=local_digest('.')
          expected='45a286bbe0f1d5681d51a651f9a832cb93889da82723efed4c261fde9a033c69'
          assert actual=='ab8c5bc19ef079cdd36df45c13240aad17fa526ba5214e55e32a4bbdb63a32a8',(actual,expected)
          print('REVIEWED_RESTRICTED_WIF_DIGEST='+actual)
          PY
