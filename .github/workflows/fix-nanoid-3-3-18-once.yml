name: Fix nanoid 3.3.18 once

on:
  push:
    paths:
      - '.github/workflows/fix-nanoid-3-3-18-once.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UAT branch
        uses: actions/checkout@v6
        with:
          ref: feature/homepage-brand-repositioning-search

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact current tree
        run: npm ci

      - name: Preserve lockfile baseline
        run: cp package-lock.json /tmp/package-lock.before.json

      - name: Update only transitive nanoid lock resolution
        run: npm update nanoid --package-lock-only

      - name: Verify lockfile scope
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/package-lock.before.json').read_text())
          after = json.loads(Path('package-lock.json').read_text())

          b = before['packages'].pop('node_modules/nanoid')
          a = after['packages'].pop('node_modules/nanoid')

          assert before == after, 'Lockfile changed outside node_modules/nanoid'
          assert b['version'] == '3.3.17', b
          assert a['version'] == '3.3.18', a
          assert a['resolved'].endswith('/nanoid-3.3.18.tgz'), a
          print('Verified: only node_modules/nanoid changed, 3.3.17 -> 3.3.18')
          PY
          git diff -- package-lock.json
          test -z "$(git diff --name-only | grep -v '^package-lock.json$' || true)"

      - name: Run full npm audit
        run: npm audit

      - name: Run npm audit JSON and verify zero vulnerabilities
        run: |
          npm audit --json | tee /tmp/npm-audit.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/npm-audit.json'))
          vulns=data.get('metadata',{}).get('vulnerabilities',{})
          assert sum(v for v in vulns.values() if isinstance(v,int)) == 0, vulns
          print('npm audit --json verified zero vulnerabilities:', vulns)
          PY

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Reinstall from patched lockfile
        run: npm ci

      - name: Run full site checks
        run: npm run check

      - name: Commit only lockfile fix and remove one-time workflow
        run: |
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git rm .github/workflows/fix-nanoid-3-3-18-once.yml
          git add package-lock.json
          git diff --cached --name-only
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/fix-nanoid-3-3-18-once.yml package-lock.json "
          git commit -m 'Patch transitive nanoid to 3.3.18'
          git push origin HEAD:feature/homepage-brand-repositioning-search
